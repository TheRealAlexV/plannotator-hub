<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Plan archive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e14'/%3E%3Cpath d='M8 9h9a4 4 0 0 1 4 4v10' stroke='%232b60ff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M8 23h9' stroke='%238b93a7' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0e14;
    --panel:#121722;
    --panel-2:#0e131d;
    --border:#1e2636;
    --border-soft:#171e2b;
    --text:#e6e9ef;
    --muted:#8b93a7;
    --accent:#2b60ff;
    --accent-soft:rgba(43,96,255,.14);
    --link:#6f9bff;
    --code-bg:#0a0d13;
    --code-inline:#1a2030;
    --ok:#3ecf8e;
    --ok-soft:rgba(62,207,142,.12);
    --bad:#ff6b6b;
    --bad-soft:rgba(255,107,107,.12);
    --warn:#f5b544;
    --warn-soft:rgba(245,181,68,.13);
    --purple:#a98bff;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --topbar-h:56px;
    --side-w:348px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  }
  ::selection{background:rgba(43,96,255,.35)}
  a{color:var(--link)}

  /* ---------- scrollbars ---------- */
  .scroll{scrollbar-width:thin;scrollbar-color:#2a3346 transparent}
  .scroll::-webkit-scrollbar{width:10px;height:10px}
  .scroll::-webkit-scrollbar-thumb{background:#252d3f;border:3px solid transparent;background-clip:content-box;border-radius:8px}
  .scroll::-webkit-scrollbar-thumb:hover{background:#33405a;background-clip:content-box}
  .scroll::-webkit-scrollbar-track{background:transparent}

  /* ---------- top bar ---------- */
  .topbar{
    flex:0 0 auto;height:var(--topbar-h);display:flex;align-items:center;gap:12px;
    padding:0 18px;border-bottom:1px solid var(--border);
    background:rgba(11,14,20,.82);backdrop-filter:blur(10px);
    position:relative;z-index:30;
  }
  .topbar::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(43,96,255,.5),transparent);
    opacity:.5;pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand svg{flex:0 0 auto;display:block}
  .brand h1{
    font-size:15px;font-weight:640;letter-spacing:.01em;margin:0;white-space:nowrap;
  }
  .brand .sub{color:var(--muted);font-size:12.5px;font-family:var(--mono);padding-left:2px}
  .topbar .spacer{flex:1 1 auto}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);
    font-size:13.5px;font-weight:520;padding:7px 12px;border-radius:9px;border:1px solid transparent;
    transition:background .16s,color .16s,border-color .16s;
  }
  .back-link:hover{color:var(--text);background:var(--panel);border-color:var(--border)}
  .back-link svg{transition:transform .16s}
  .back-link:hover svg{transform:translateX(2px)}

  /* ---------- layout ---------- */
  .app{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr)}

  /* ---------- sidebar ---------- */
  .sidebar{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--panel)}
  .side-head{flex:0 0 auto;padding:14px 14px 11px;border-bottom:1px solid var(--border)}
  .search{position:relative;display:flex;align-items:center}
  .search svg{position:absolute;left:11px;color:var(--muted);pointer-events:none}
  .search input{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    font:inherit;font-size:13.5px;padding:9px 34px 9px 34px;border-radius:10px;outline:none;
    transition:border-color .16s,box-shadow .16s;
  }
  .search input::placeholder{color:#5e677d}
  .search input:focus{border-color:#33507f;box-shadow:0 0 0 3px var(--accent-soft)}
  .search kbd{
    position:absolute;right:9px;font:600 10.5px/1 var(--mono);color:var(--muted);
    border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:3px 5px;background:var(--panel-2);
  }
  .filters{display:flex;gap:6px;margin-top:10px}
  .chip{
    flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;gap:5px;
    background:transparent;border:1px solid var(--border);color:var(--muted);
    font:inherit;font-size:12px;font-weight:540;padding:6px 8px;border-radius:8px;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip:hover{color:var(--text);border-color:#2a3448}
  .chip .n{font-family:var(--mono);font-size:10.5px;opacity:.7}
  .chip[aria-pressed="true"]{background:var(--accent-soft);border-color:rgba(43,96,255,.5);color:#cbd8ff}
  .side-count{
    margin-top:10px;font-size:11.5px;color:var(--muted);font-family:var(--mono);
    display:flex;justify-content:space-between;gap:8px;
  }

  .list{flex:1 1 auto;overflow-y:auto;padding:6px 0 20px}
  .row{
    display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--border-soft);
    color:inherit;font:inherit;cursor:pointer;position:relative;
    padding:11px 14px 11px 15px;transition:background .14s;
  }
  .row:hover{background:rgba(255,255,255,.028)}
  .row[aria-current="true"]{background:linear-gradient(90deg,var(--accent-soft),rgba(43,96,255,.04))}
  .row[aria-current="true"]::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);
  }
  .row-title{
    font-size:13.8px;font-weight:540;line-height:1.4;color:#dfe3ec;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-word;
  }
  .row[aria-current="true"] .row-title{color:#fff}
  .row-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
  .row-meta .dot{width:3px;height:3px;border-radius:50%;background:#3a445c;flex:0 0 auto}
  .row-meta .host{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .badge{
    display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;
    font:600 10px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;
    padding:3px 7px;border-radius:999px;border:1px solid transparent;
  }
  .badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .badge.approved{color:var(--ok);background:var(--ok-soft);border-color:rgba(62,207,142,.28)}
  .badge.denied{color:var(--bad);background:var(--bad-soft);border-color:rgba(255,107,107,.28)}
  .badge.feedback{color:var(--warn);background:var(--warn-soft);border-color:rgba(245,181,68,.28)}

  .skeleton{padding:12px 14px;border-bottom:1px solid var(--border-soft)}
  .skeleton i{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,#1a2130,#242d40,#1a2130);background-size:200% 100%;animation:shimmer 1.3s infinite}
  .skeleton i:nth-child(1){width:78%}
  .skeleton i:nth-child(2){width:45%;margin-top:9px;height:7px}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .empty{padding:38px 22px;text-align:center;color:var(--muted)}
  .empty .big{font-size:14px;color:#aab2c4;font-weight:560;margin-bottom:6px}
  .empty .small{font-size:12.5px;line-height:1.6}

  /* ---------- viewer ---------- */
  .viewer{min-height:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
  .viewer::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(680px 320px at 80% -10%,rgba(43,96,255,.10),transparent 70%);
  }
  .viewer-head{
    flex:0 0 auto;position:relative;z-index:5;
    padding:16px 32px 14px;border-bottom:1px solid var(--border);
    background:rgba(11,14,20,.86);backdrop-filter:blur(10px);
  }
  .viewer-head-top{display:flex;align-items:flex-start;gap:14px}
  .viewer-title{
    font-size:19px;font-weight:640;line-height:1.32;letter-spacing:-.008em;margin:0;
    flex:1 1 auto;min-width:0;word-break:break-word;
  }
  .viewer-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--muted);font-family:var(--mono)}
  .viewer-meta .dot{width:3px;height:3px;border-radius:50%;background:#3a445c}
  .viewer-actions{display:flex;gap:6px;flex:0 0 auto}
  .btn{
    display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);
    color:var(--muted);font:inherit;font-size:12.5px;font-weight:540;padding:7px 11px;border-radius:9px;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .btn:hover{color:var(--text);border-color:#2c374d;background:#161d2b}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:rgba(43,96,255,.5);color:#cbd8ff}
  .btn[hidden]{display:none}
  .btn .ico{opacity:.85}

  .doc-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;position:relative;z-index:1}

  /* document body */
  .doc{max-width:820px;margin:0 auto;padding:38px 32px 120px}
  .md{line-height:1.75;font-size:15.2px;color:#dfe3ec;animation:fadeUp .28s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .md>*:first-child{margin-top:0}
  .md h1{font-size:25px;line-height:1.28;font-weight:650;letter-spacing:-.014em;margin:0 0 .5em;color:#fff}
  .md h2{font-size:19px;font-weight:620;letter-spacing:-.008em;margin:1.9em 0 .7em;padding-bottom:.34em;border-bottom:1px solid var(--border);color:#f0f2f7}
  .md h3{font-size:16.2px;font-weight:600;margin:1.5em 0 .45em;color:#eef0f6}
  .md h4{font-size:14.4px;font-weight:620;margin:1.25em 0 .35em;color:#e3e7ef;text-transform:none}
  .md h5,.md h6{font-size:13.4px;font-weight:620;margin:1.1em 0 .3em;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .md p{margin:.85em 0}
  .md strong{color:#fff;font-weight:640}
  .md em{color:#e9ecf3}
  .md a{color:var(--link);text-decoration:none;border-bottom:1px solid rgba(111,155,255,.34);transition:border-color .15s,color .15s}
  .md a:hover{color:#9fbcff;border-bottom-color:currentColor}
  .md ul,.md ol{padding-left:1.5em;margin:.75em 0}
  .md li{margin:.32em 0}
  .md li::marker{color:#5f6a82}
  .md li>ul,.md li>ol{margin:.3em 0}
  .md hr{border:none;border-top:1px solid var(--border);margin:1.9em 0}
  .md img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--border)}

  .md code{font-family:var(--mono);font-size:.855em;background:var(--code-inline);border:1px solid #263048;border-radius:5px;padding:.13em .4em;color:#cfd9f0;word-break:break-word}
  .md pre{
    position:relative;background:var(--code-bg);border:1px solid var(--border);border-radius:12px;
    padding:15px 17px;margin:1.05em 0;overflow:auto;
  }
  .md pre code{display:block;background:none;border:0;padding:0;color:#c9d3e6;font-size:12.7px;line-height:1.68;white-space:pre}
  .md pre[data-lang]::before{
    content:attr(data-lang);position:absolute;top:9px;right:13px;
    font:600 9.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:#5f6a82;
  }
  .md pre[data-lang] code{padding-top:2px}

  .md blockquote{
    margin:1.05em 0;padding:.7em 1.15em;border-left:3px solid var(--accent);
    background:rgba(43,96,255,.055);border-radius:0 10px 10px 0;color:#c7cfdd;
  }
  .md blockquote p{margin:.35em 0}
  .md blockquote>*:first-child{margin-top:0}
  .md blockquote>*:last-child{margin-bottom:0}

  /* github-style callouts */
  .md .callout{border-left-width:3px;padding-top:.85em}
  .md .callout .callout-label{
    display:flex;align-items:center;gap:6px;font:640 11px/1 var(--sans);letter-spacing:.06em;
    text-transform:uppercase;margin-bottom:.5em;
  }
  .md .callout .callout-label .mark{font-size:12px}
  .md .callout-note{border-left-color:var(--link);background:rgba(111,155,255,.07)}
  .md .callout-note .callout-label{color:var(--link)}
  .md .callout-tip{border-left-color:var(--ok);background:var(--ok-soft)}
  .md .callout-tip .callout-label{color:var(--ok)}
  .md .callout-important{border-left-color:var(--purple);background:rgba(169,139,255,.09)}
  .md .callout-important .callout-label{color:var(--purple)}
  .md .callout-warning{border-left-color:var(--warn);background:var(--warn-soft)}
  .md .callout-warning .callout-label{color:var(--warn)}
  .md .callout-caution{border-left-color:var(--bad);background:var(--bad-soft)}
  .md .callout-caution .callout-label{color:var(--bad)}

  .md .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:11px;margin:1.1em 0;background:var(--panel-2)}
  .md table{width:100%;border-collapse:collapse;font-size:13.3px;line-height:1.5}
  .md th{text-align:left;font-weight:620;color:#eaeef6;background:#151b28;padding:10px 13px;border-bottom:1px solid var(--border);white-space:nowrap}
  .md td{padding:9px 13px;border-bottom:1px solid var(--border-soft);vertical-align:top;color:#d3d9e5}
  .md tr:last-child td{border-bottom:none}
  .md tbody tr:hover{background:rgba(255,255,255,.02)}

  .md .task-list-item{list-style:none;margin-left:-1.3em}
  .md .task-list-item input{margin-right:.5em;accent-color:var(--accent)}

  /* mermaid */
  .md .mermaid{
    background:#0e1420;border:1px solid var(--border);border-radius:12px;
    padding:20px 18px;margin:1.2em 0;display:flex;justify-content:center;overflow-x:auto;
  }
  .md .mermaid svg{max-width:100%;height:auto}
  .md .mermaid-failed{background:#150f16;border:1px solid #3a2430;border-radius:12px;padding:0;margin:1.2em 0;overflow:hidden}
  .md .mermaid-failed .mermaid-src{margin:0;border:0;border-bottom:1px solid #3a2430;border-radius:0;background:#0d0a12}
  .md .mermaid-error{padding:11px 15px;font-size:12.5px;color:#ffb0b0;display:flex;gap:8px;align-items:flex-start;line-height:1.5}

  /* raw view */
  .raw-wrap{max-width:900px;margin:0 auto;padding:30px 32px 120px}
  .raw-bar{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .raw-pre{
    background:var(--code-bg);border:1px solid var(--border);border-radius:12px;padding:18px;
    overflow:auto;margin:0;font-family:var(--mono);font-size:12.7px;line-height:1.7;color:#c9d3e6;white-space:pre;
  }

  /* state panels */
  .state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 30px;color:var(--muted);min-height:60vh;gap:14px}
  .state .big{font-size:15px;color:#c3cad9;font-weight:580}
  .state .small{font-size:13px;line-height:1.65;max-width:420px}
  .state .small code{font-family:var(--mono);background:var(--code-inline);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:12px}
  .spinner{width:26px;height:26px;border-radius:50%;border:2.5px solid #232c3e;border-top-color:var(--accent);animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .state .icon{width:40px;height:40px;color:#3a4560}

  .mobile-back{display:none}

  @media (max-width:900px){
    :root{--side-w:300px}
  }
  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .viewer{display:none}
    body.showing-detail .sidebar{display:none}
    body.showing-detail .viewer{display:flex}
    .doc{padding:22px 18px 100px}
    .raw-wrap{padding:20px 16px 100px}
    .viewer-head{padding:12px 16px}
    .viewer-title{font-size:16.5px}
    .mobile-back{display:inline-flex}
    .brand .sub{display:none}
    .topbar{padding:0 14px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#121722" stroke="#1e2636"/>
        <path d="M8 9h9a4 4 0 0 1 4 4v10" stroke="#2b60ff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M8 23h9" stroke="#8b93a7" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <h1>Plan archive</h1>
      <span class="sub" id="brandCount"></span>
    </div>
    <div class="spacer"></div>
    <a class="back-link" href="/">
      Sessions
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </header>

  <div class="app" id="app">
    <aside class="sidebar">
      <div class="side-head">
        <div class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
          <input id="search" type="search" placeholder="Search plans…" autocomplete="off" spellcheck="false" aria-label="Search plans">
          <kbd>/</kbd>
        </div>
        <div class="filters" role="group" aria-label="Filter by status">
          <button class="chip" data-status="all" aria-pressed="true">All <span class="n" data-n="all"></span></button>
          <button class="chip" data-status="approved" aria-pressed="false">Approved <span class="n" data-n="approved"></span></button>
          <button class="chip" data-status="denied" aria-pressed="false">Denied <span class="n" data-n="denied"></span></button>
        </div>
        <div class="side-count"><span id="listCount">Loading…</span></div>
      </div>
      <div class="list scroll" id="list" role="listbox" aria-label="Archived plans"></div>
    </aside>

    <main class="viewer" id="viewer">
      <div class="viewer-head" id="viewerHead" hidden>
        <div class="viewer-head-top">
          <button class="btn mobile-back" id="mobileBack" aria-label="Back to list">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
            List
          </button>
          <h2 class="viewer-title" id="viewerTitle">—</h2>
          <div class="viewer-actions">
            <button class="btn" id="rawToggle" aria-pressed="false" title="Show untouched markdown">
              <svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>
              Raw
            </button>
          </div>
        </div>
        <div class="viewer-meta" id="viewerMeta"></div>
      </div>
      <div class="doc-scroll scroll" id="docScroll">
        <div class="state" id="statePanel">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v5h5"/><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M9 13h6M9 17h4"/></svg>
          <div class="big">Select a plan</div>
          <div class="small">Choose an archived plan from the list to read it here. Diagrams, tables and code blocks render inline.</div>
        </div>
        <div class="doc" id="doc" hidden></div>
        <div class="raw-wrap" id="rawWrap" hidden>
          <div class="raw-bar">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>
            Raw markdown
          </div>
          <pre class="raw-pre scroll" id="rawPre"></pre>
        </div>
      </div>
    </main>
  </div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
(function(){
  "use strict";

  /* ===================================================================
     Constants / helpers
  =================================================================== */
  var API_LIST = "api/plans";
  var API_RAW  = "api/plans/raw";

  var els = {
    list:        document.getElementById("list"),
    search:      document.getElementById("search"),
    chips:       Array.prototype.slice.call(document.querySelectorAll(".chip")),
    countN:      document.querySelectorAll("[data-n]"),
    listCount:   document.getElementById("listCount"),
    brandCount:  document.getElementById("brandCount"),
    viewerHead:  document.getElementById("viewerHead"),
    viewerTitle: document.getElementById("viewerTitle"),
    viewerMeta:  document.getElementById("viewerMeta"),
    rawToggle:   document.getElementById("rawToggle"),
    docScroll:   document.getElementById("docScroll"),
    doc:         document.getElementById("doc"),
    rawWrap:     document.getElementById("rawWrap"),
    rawPre:      document.getElementById("rawPre"),
    statePanel:  document.getElementById("statePanel"),
    mobileBack:  document.getElementById("mobileBack")
  };

  var state = {
    plans: [],
    filtered: [],
    selected: null,
    query: "",
    status: "all",
    raw: null,
    showRaw: false,
    loadSeq: 0
  };

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function el(tag, cls, txt){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(txt != null) n.textContent = txt;
    return n;
  }
  function fmtDate(p){
    if(p.date){
      var iso = /^(\d{4})-(\d{2})-(\d{2})$/.exec(p.date);
      var d = iso ? new Date(+iso[1], +iso[2]-1, +iso[3]) : new Date(p.date);
      if(!isNaN(d)) return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"2-digit"});
      return p.date;
    }
    var ts = p.timestamp ? new Date(p.timestamp) : null;
    if(ts && !isNaN(ts)) return ts.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"2-digit"});
    return "";
  }
  function isFeedback(p){ return /\.annotations\.md$/i.test(p.filename || ""); }
  function badgeKind(p){ return isFeedback(p) ? "feedback" : (p.status === "denied" ? "denied" : "approved"); }

  /* ===================================================================
     Markdown loading + setup
  =================================================================== */
  var markedReady = false;
  if(window.marked){
    try{
      window.marked.setOptions({ gfm:true, breaks:false, pedantic:false });
      markedReady = true;
    }catch(e){ /* older/newer API – defaults are fine */ markedReady = !!window.marked.parse; }
  }

  var mermaidReady = false;
  if(window.mermaid){
    try{
      window.mermaid.initialize({
        startOnLoad:false,
        theme:"dark",
        darkMode:true,
        securityLevel:"strict",
        fontFamily:"ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif",
        themeVariables:{
          background:"#0e1420",
          primaryColor:"#1b2440",
          primaryBorderColor:"#33507f",
          primaryTextColor:"#e6e9ef",
          lineColor:"#5a6a8c",
          tertiaryColor:"#151b28",
          fontSize:"14px"
        },
        flowchart:{ useMaxWidth:true, htmlLabels:false },
        sequence:{ useMaxWidth:true }
      });
      mermaidReady = true;
    }catch(e){ mermaidReady = false; }
  }

  /* ===================================================================
     Sanitise marked output: strip scripts/handlers, harden links.
  =================================================================== */
  var BLOCKED = {script:1,style:1,iframe:1,object:1,embed:1,link:1,meta:1,base:1,
                 form:1,input:1,button:1,textarea:1,select:1,option:1,noscript:1,template:1};

  function sanitize(html){
    var tpl = document.createElement("template");
    tpl.innerHTML = html;
    walk(tpl.content);
    return tpl.innerHTML;

    function walk(root){
      var nodes = Array.prototype.slice.call(root.children);
      for(var i=0;i<nodes.length;i++){
        var el = nodes[i];
        var tag = el.tagName.toLowerCase();
        if(BLOCKED[tag]){ el.remove(); continue; }
        var attrs = Array.prototype.slice.call(el.attributes);
        for(var j=0;j<attrs.length;j++){
          var name = attrs[j].name, val = attrs[j].value, ln = name.toLowerCase();
          if(ln.indexOf("on") === 0){ el.removeAttribute(name); continue; }
          if(ln === "srcdoc"){ el.removeAttribute(name); continue; }
          if(ln === "href" || ln === "src" || ln === "xlink:href"){
            var v = String(val).replace(/[\u0000-\u0020]/g, "");
            var bad = /^(javascript|vbscript|file):/i.test(v) ||
                      (/^data:/i.test(v) && !(ln === "src" && /^data:image\//i.test(v)));
            if(bad) el.removeAttribute(name);
          }
        }
        if(tag === "a"){
          el.setAttribute("rel","noopener noreferrer");
          el.setAttribute("target","_blank");
        }
        walk(el);
      }
    }
  }

  /* ===================================================================
     Render a markdown string into #doc
  =================================================================== */
  function buildMarkdownDom(md){
    if(!markedReady || !window.marked || typeof window.marked.parse !== "function"){
      var fallback = el("pre","raw-pre");
      fallback.textContent = md;
      return fallback;
    }
    var html = window.marked.parse(md);
    var root = el("div","md");
    root.innerHTML = sanitize(html);

    /* mermaid blocks -> .mermaid nodes carrying their source */
    Array.prototype.slice.call(root.querySelectorAll("pre > code.language-mermaid")).forEach(function(code){
      var pre = code.parentElement;
      var d = el("div","mermaid");
      d.dataset.source = code.textContent;
      d.textContent = code.textContent;
      pre.replaceWith(d);
    });

    /* language label + block hardening for other code blocks */
    Array.prototype.slice.call(root.querySelectorAll("pre > code")).forEach(function(code){
      var pre = code.parentElement;
      var m = /language-([\w+#-]+)/i.exec(code.className || "");
      if(m) pre.dataset.lang = m[1].toLowerCase();
    });

    /* wrap tables for horizontal scroll */
    Array.prototype.slice.call(root.querySelectorAll("table")).forEach(function(t){
      var wrap = el("div","table-wrap");
      t.replaceWith(wrap);
      wrap.appendChild(t);
    });

    /* github-style callouts: > [!IMPORTANT] */
    var MARK = {note:"ℹ",tip:"✦",important:"❗",warning:"⚠",caution:"⚠"};
    Array.prototype.slice.call(root.querySelectorAll("blockquote")).forEach(function(bq){
      var p = bq.querySelector("p");
      if(!p) return;
      var m = /^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i.exec(p.textContent || "");
      if(!m) return;
      var kind = m[1].toLowerCase();
      p.textContent = p.textContent.replace(m[0], "");
      bq.classList.add("callout","callout-"+kind);
      var label = el("div","callout-label");
      var mk = el("span","mark",MARK[kind] || "•");
      label.appendChild(mk);
      label.appendChild(document.createTextNode(kind));
      bq.insertBefore(label, bq.firstChild);
    });

    return root;
  }

  /* ===================================================================
     Mermaid run + graceful failure
  =================================================================== */
  function failMermaid(node, msg){
    var src = node.dataset.source || "";
    node.classList.remove("mermaid");
    node.classList.add("mermaid-failed");
    node.textContent = "";
    var pre = el("pre","mermaid-src");
    var code = el("code", null, src);
    pre.appendChild(code);
    var note = el("div","mermaid-error");
    note.appendChild(document.createTextNode("⚠"));
    note.appendChild(el("span", null, "Couldn't render this diagram — " + (msg || "unknown error") + "."));
    node.appendChild(pre);
    node.appendChild(note);
  }

  function runMermaid(root){
    var nodes = Array.prototype.slice.call(root.querySelectorAll(".mermaid"));
    if(!nodes.length) return;

    if(!mermaidReady || !window.mermaid){
      nodes.forEach(function(n){ failMermaid(n, "Mermaid library unavailable"); });
      return;
    }

    var good = [];
    Promise.all(nodes.map(function(n){
      var src = n.dataset.source || n.textContent || "";
      return Promise.resolve()
        .then(function(){ return window.mermaid.parse(src); })
        .then(function(){ good.push(n); })
        .catch(function(err){ failMermaid(n, (err && err.message) ? err.message : "invalid diagram syntax"); });
    })).then(function(){
      if(!good.length) return null;
      return window.mermaid.run({ nodes: good, suppressErrors: true });
    }).catch(function(){ /* handled per-node below */ }).then(function(){
      good.forEach(function(n){
        if(!n.querySelector("svg")) failMermaid(n, "render failed");
        else n.classList.add("mermaid-ok");
      });
    });
  }

  /* ===================================================================
     List rendering
  =================================================================== */
  function applyFilters(){
    var q = state.query.trim().toLowerCase();
    state.filtered = state.plans.filter(function(p){
      if(state.status !== "all" && p.status !== state.status) return false;
      if(!q) return true;
      var hay = (p.title || "") + " " + (p.filename || "") + " " + (p.hostLabel || "") + " " + (p.host || "");
      return hay.toLowerCase().indexOf(q) !== -1;
    });
  }

  function updateCounts(){
    var counts = {all:state.plans.length, approved:0, denied:0};
    state.plans.forEach(function(p){ if(counts[p.status] != null) counts[p.status]++; });
    els.countN.forEach(function(n){ n.textContent = counts[n.dataset.n] || 0; });
    if(state.plans.length){
      els.brandCount.textContent = counts.all + " plans";
      var shown = state.filtered.length;
      els.listCount.textContent = (shown === state.plans.length)
        ? shown + " plans"
        : shown + " of " + state.plans.length + " plans";
    } else {
      els.listCount.textContent = "";
      els.brandCount.textContent = "";
    }
  }

  function renderList(){
    els.list.textContent = "";
    updateCounts();

    if(!state.plans.length){ return; } /* loading/empty handled separately */

    if(!state.filtered.length){
      var em = el("div","empty");
      em.appendChild(el("div","big","No plans match"));
      em.appendChild(el("div","small","Try a different search term or switch the status filter back to All."));
      els.list.appendChild(em);
      return;
    }

    var frag = document.createDocumentFragment();
    state.filtered.forEach(function(p){
      var row = el("button","row");
      row.type = "button";
      row.setAttribute("role","option");
      row.dataset.host = p.host;
      row.dataset.filename = p.filename;
      var current = state.selected && state.selected.filename === p.filename && state.selected.host === p.host;
      row.setAttribute("aria-current", current ? "true" : "false");

      row.appendChild(el("div","row-title", p.title || p.filename));

      var meta = el("div","row-meta");
      var kind = badgeKind(p);
      meta.appendChild(el("span","badge "+kind, kind === "feedback" ? "feedback" : p.status));
      meta.appendChild(el("span","dot"));
      meta.appendChild(el("span", null, fmtDate(p)));
      if(p.hostLabel || p.host){
        meta.appendChild(el("span","dot"));
        meta.appendChild(el("span","host", p.hostLabel || p.host));
      }
      row.appendChild(meta);

      row.addEventListener("click", function(){ selectPlan(p); });
      frag.appendChild(row);
    });
    els.list.appendChild(frag);
  }

  function markActiveRow(){
    Array.prototype.slice.call(els.list.querySelectorAll(".row")).forEach(function(r){
      var on = state.selected && r.dataset.filename === state.selected.filename && r.dataset.host === state.selected.host;
      r.setAttribute("aria-current", on ? "true" : "false");
    });
  }

  /* ===================================================================
     Viewer
  =================================================================== */
  function showState(kind, title, detail){
    els.doc.hidden = true;
    els.rawWrap.hidden = true;
    els.statePanel.hidden = false;
    els.statePanel.textContent = "";
    if(kind === "loading"){
      els.statePanel.appendChild(el("div","spinner"));
      els.statePanel.appendChild(el("div","big", title || "Loading plan…"));
    } else {
      var ico = document.createElementNS("http://www.w3.org/2000/svg","svg");
      ico.setAttribute("class","icon"); ico.setAttribute("viewBox","0 0 24 24");
      ico.setAttribute("fill","none"); ico.setAttribute("stroke","currentColor");
      ico.setAttribute("stroke-width","1.6");
      if(kind === "error"){
        ico.innerHTML = '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>';
      } else {
        ico.innerHTML = '<path d="M14 3v5h5"/><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>';
      }
      els.statePanel.appendChild(ico);
      els.statePanel.appendChild(el("div","big", title || ""));
      if(detail){ els.statePanel.appendChild(el("div","small", detail)); }
    }
    els.docScroll.scrollTop = 0;
  }

  function renderViewerHead(p, heading){
    els.viewerHead.hidden = false;
    els.viewerTitle.textContent = heading || p.title || p.filename;
    var meta = els.viewerMeta;
    meta.textContent = "";
    var kind = badgeKind(p);
    meta.appendChild(el("span","badge "+kind, kind === "feedback" ? "feedback" : p.status));
    meta.appendChild(el("span","dot"));
    meta.appendChild(el("span", null, fmtDate(p)));
    var host = p.hostLabel || p.host;
    if(host){ meta.appendChild(el("span","dot")); meta.appendChild(el("span", null, host)); }
    if(p.size){ meta.appendChild(el("span","dot")); meta.appendChild(el("span", null, Math.round(p.size/1024) + " KB")); }
    meta.appendChild(el("span","dot"));
    meta.appendChild(el("span", null, p.filename));
  }

  function firstHeading(md){
    var lines = String(md).split(/\r?\n/);
    for(var i=0;i<lines.length && i<60;i++){
      var m = /^#\s+(.+?)\s*$/.exec(lines[i]);
      if(m) return m[1].replace(/[*_`]/g,"").trim();
    }
    return null;
  }

  function renderDoc(){
    if(state.raw == null) return;
    if(state.showRaw){
      els.doc.hidden = true;
      els.statePanel.hidden = true;
      els.rawWrap.hidden = false;
      els.rawPre.textContent = state.raw;
      els.docScroll.scrollTop = 0;
      return;
    }
    els.rawWrap.hidden = true;
    els.statePanel.hidden = true;
    els.doc.hidden = false;
    els.doc.textContent = "";
    var built = buildMarkdownDom(state.raw);
    built.style.animation = "none";
    els.doc.appendChild(built);
    /* force reflow so the fade animation replays on each selection */
    void built.offsetWidth;
    built.style.animation = "";
    els.docScroll.scrollTop = 0;
    runMermaid(els.doc);
  }

  function selectPlan(p, opts){
    opts = opts || {};
    state.loadSeq++;
    var seq = state.loadSeq;
    state.selected = p;
    state.raw = null;
    state.showRaw = false;
    els.rawToggle.setAttribute("aria-pressed","false");

    document.body.classList.add("showing-detail");
    markActiveRow();
    renderViewerHead(p, p.title || p.filename);
    showState("loading", "Loading plan…");

    if(!opts.fromHash){
      try{ history.replaceState(null, "", "#" + encodeURIComponent(p.host) + "/" + encodeURIComponent(p.filename)); }catch(e){}
    }

    var url = API_RAW + "?host=" + encodeURIComponent(p.host) + "&filename=" + encodeURIComponent(p.filename);
    fetch(url, { headers: { "Accept": "text/plain, text/markdown, */*" } })
      .then(function(res){
        if(!res.ok) throw new Error("HTTP " + res.status + " " + (res.statusText || ""));
        return res.text();
      })
      .then(function(text){
        if(seq !== state.loadSeq) return;
        state.raw = text;
        var h = firstHeading(text);
        if(h) renderViewerHead(p, h);
        renderDoc();
      })
      .catch(function(err){
        if(seq !== state.loadSeq) return;
        showState("error", "Couldn't load this plan",
          "The request to " + url + " failed (" + (err && err.message ? err.message : "unknown error") + "). Check that the archive API is reachable, then try again.");
      });
  }

  /* ===================================================================
     Plan list fetch
  =================================================================== */
  function loadPlans(){
    els.list.textContent = "";
    for(var i=0;i<7;i++){
      var sk = el("div","skeleton");
      sk.appendChild(el("i")); sk.appendChild(el("i"));
      els.list.appendChild(sk);
    }
    els.listCount.textContent = "Loading…";

    fetch(API_LIST, { headers: { "Accept": "application/json" } })
      .then(function(res){
        if(!res.ok) throw new Error("HTTP " + res.status + " " + (res.statusText || ""));
        return res.json();
      })
      .then(function(data){
        var plans = (data && Array.isArray(data.plans)) ? data.plans.slice() : [];
        state.plans = plans;
        /* keep server order when un-timestamped, else newest first */
        state.plans.sort(function(a,b){
          var ta = a.timestamp ? Date.parse(a.timestamp) : 0;
          var tb = b.timestamp ? Date.parse(b.timestamp) : 0;
          if(ta && tb && ta !== tb) return tb - ta;
          return 0;
        });
        applyFilters();
        renderList();
        if(!state.plans.length){
          els.list.textContent = "";
          var em = el("div","empty");
          em.appendChild(el("div","big","No archived plans"));
          em.appendChild(el("div","small","The archive is empty for this host."));
          els.list.appendChild(em);
        }
        restoreFromHash();
      })
      .catch(function(err){
        els.list.textContent = "";
        var em = el("div","empty");
        em.appendChild(el("div","big","Couldn't load plans"));
        em.appendChild(el("div","small","Request to " + API_LIST + " failed (" + esc(err && err.message ? err.message : "unknown error") + ")."));
        els.list.appendChild(em);
        els.listCount.textContent = "";
        els.brandCount.textContent = "";
      });
  }

  /* ===================================================================
     Filters / search / hash / events
  =================================================================== */
  function setStatus(s){
    state.status = s;
    els.chips.forEach(function(c){ c.setAttribute("aria-pressed", String(c.dataset.status === s)); });
    applyFilters();
    renderList();
  }

  var searchTimer = null;
  els.search.addEventListener("input", function(){
    clearTimeout(searchTimer);
    var v = els.search.value;
    searchTimer = setTimeout(function(){
      state.query = v;
      applyFilters();
      renderList();
    }, 120);
  });

  els.chips.forEach(function(c){
    c.addEventListener("click", function(){ setStatus(c.dataset.status); });
  });

  els.rawToggle.addEventListener("click", function(){
    if(!state.raw) return;
    state.showRaw = !state.showRaw;
    els.rawToggle.setAttribute("aria-pressed", String(state.showRaw));
    renderDoc();
  });

  els.mobileBack.addEventListener("click", function(){
    document.body.classList.remove("showing-detail");
  });

  document.addEventListener("keydown", function(e){
    var tag = (e.target && e.target.tagName || "").toLowerCase();
    var typing = tag === "input" || tag === "textarea";
    if(e.key === "/" && !typing){
      e.preventDefault();
      els.search.focus();
      els.search.select();
    } else if(e.key === "Escape" && typing){
      els.search.value = ""; state.query = ""; applyFilters(); renderList(); els.search.blur();
    } else if(!typing && (e.key === "ArrowDown" || e.key === "ArrowUp") && state.filtered.length){
      e.preventDefault();
      var idx = state.selected ? state.filtered.findIndex(function(p){
        return p.filename === state.selected.filename && p.host === state.selected.host;
      }) : -1;
      var next = e.key === "ArrowDown"
        ? Math.min(state.filtered.length - 1, idx + 1)
        : Math.max(0, (idx < 0 ? 0 : idx - 1));
      selectPlan(state.filtered[next]);
      var active = els.list.querySelector('.row[aria-current="true"]');
      if(active) active.scrollIntoView({ block:"nearest" });
    }
  });

  function restoreFromHash(){
    var h = location.hash.replace(/^#/, "");
    if(!h) return;
    var parts = h.split("/");
    if(parts.length < 2) return;
    var host = decodeURIComponent(parts[0]);
    var filename = decodeURIComponent(parts.slice(1).join("/"));
    var p = state.plans.find(function(x){ return x.host === host && x.filename === filename; });
    if(p) selectPlan(p, { fromHash:true });
  }

  window.addEventListener("hashchange", function(){
    if(!state.plans.length) return;
    var h = location.hash.replace(/^#/, "");
    if(!h) return;
    var parts = h.split("/");
    if(parts.length < 2) return;
    var host = decodeURIComponent(parts[0]);
    var filename = decodeURIComponent(parts.slice(1).join("/"));
    if(state.selected && state.selected.host === host && state.selected.filename === filename) return;
    var p = state.plans.find(function(x){ return x.host === host && x.filename === filename; });
    if(p) selectPlan(p, { fromHash:true });
  });

  loadPlans();
})();
</script>
</body>
</html>
