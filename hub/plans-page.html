<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Plan archive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e14'/%3E%3Cpath d='M8 9h9a4 4 0 0 1 4 4v10' stroke='%232b60ff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M8 23h9' stroke='%238b93a7' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0e14; --panel:#121722; --panel-2:#0e131d;
    --border:#1e2636; --border-soft:#171e2b;
    --text:#e6e9ef; --muted:#8b93a7;
    --accent:#2b60ff; --accent-soft:rgba(43,96,255,.14); --link:#6f9bff;
    --code-bg:#0a0d13; --code-inline:#1a2030;
    --ok:#3ecf8e; --ok-soft:rgba(62,207,142,.12);
    --bad:#ff6b6b; --bad-soft:rgba(255,107,107,.12);
    --warn:#f5b544; --warn-soft:rgba(245,181,68,.13);
    --purple:#a98bff;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --topbar-h:56px;
    --side-w:352px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  }
  ::selection{background:rgba(43,96,255,.35)}
  a{color:var(--link)}
  .scroll{scrollbar-width:thin;scrollbar-color:#2a3346 transparent}
  .scroll::-webkit-scrollbar{width:10px;height:10px}
  .scroll::-webkit-scrollbar-thumb{background:#252d3f;border:3px solid transparent;background-clip:content-box;border-radius:8px}
  .scroll::-webkit-scrollbar-thumb:hover{background:#33405a;background-clip:content-box}
  .scroll::-webkit-scrollbar-track{background:transparent}

  /* ---------- top bar ---------- */
  .topbar{
    flex:0 0 auto;height:var(--topbar-h);display:flex;align-items:center;gap:12px;
    padding:0 18px;border-bottom:1px solid var(--border);
    background:rgba(11,14,20,.82);backdrop-filter:blur(10px);position:relative;z-index:30;
  }
  .topbar::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(43,96,255,.5),transparent);opacity:.5;pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand svg{flex:0 0 auto;display:block}
  .brand h1{font-size:15px;font-weight:640;letter-spacing:.01em;margin:0;white-space:nowrap}
  .brand .sub{color:var(--muted);font-size:12.5px;font-family:var(--mono);padding-left:2px}
  .topbar .spacer{flex:1 1 auto}

  .tabs{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--border);border-radius:11px;padding:3px;flex:0 0 auto}
  .tab{
    background:none;border:0;color:var(--muted);font:inherit;font-size:13px;font-weight:540;
    padding:6px 13px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    transition:background .15s,color .15s;white-space:nowrap;
  }
  .tab:hover{color:var(--text)}
  .tab[aria-selected="true"]{background:var(--accent-soft);color:#cbd8ff;box-shadow:inset 0 0 0 1px rgba(43,96,255,.35)}
  .tab .cnt{font-family:var(--mono);font-size:10.5px;opacity:.75}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);
    font-size:13.5px;font-weight:520;padding:7px 12px;border-radius:9px;border:1px solid transparent;
    transition:background .16s,color .16s,border-color .16s;
  }
  .back-link:hover{color:var(--text);background:var(--panel);border-color:var(--border)}

  /* ---------- layout ---------- */
  .app{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr)}
  .sidebar{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--panel)}
  .side-head{flex:0 0 auto;padding:13px 13px 10px;border-bottom:1px solid var(--border)}

  .search{position:relative;display:flex;align-items:center}
  .search svg{position:absolute;left:11px;color:var(--muted);pointer-events:none}
  .search input{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    font:inherit;font-size:13.5px;padding:9px 34px;border-radius:10px;outline:none;
    transition:border-color .16s,box-shadow .16s;
  }
  .search input::placeholder{color:#5e677d}
  .search input:focus{border-color:#33507f;box-shadow:0 0 0 3px var(--accent-soft)}
  .search kbd{
    position:absolute;right:9px;font:600 10.5px/1 var(--mono);color:var(--muted);
    border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:3px 5px;background:var(--panel-2);
  }
  .filters{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
  .chip{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:1 1 auto;
    background:transparent;border:1px solid var(--border);color:var(--muted);
    font:inherit;font-size:12px;font-weight:540;padding:6px 9px;border-radius:8px;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip:hover{color:var(--text);border-color:#2a3448}
  .chip .n{font-family:var(--mono);font-size:10.5px;opacity:.7}
  .chip[aria-pressed="true"]{background:var(--accent-soft);border-color:rgba(43,96,255,.5);color:#cbd8ff}

  .stats{margin-top:10px;font-size:11.5px;color:var(--muted);font-family:var(--mono);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .stats .lft{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stats .lft b{color:#c3cad9;font-weight:600}

  .tagsec{margin-top:10px;border-top:1px solid var(--border-soft);padding-top:9px}
  .tagsec-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .tagsec-head .lbl{font:600 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .tagsec-head .grow{flex:1 1 auto}
  .modeswitch{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
  .modeswitch button{background:none;border:0;color:var(--muted);font:inherit;font-size:10.5px;font-weight:560;padding:3px 8px;cursor:pointer;font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
  .modeswitch button[aria-pressed="true"]{background:var(--accent-soft);color:#cbd8ff}
  .taglist{display:flex;flex-wrap:wrap;gap:5px;max-height:112px;overflow-y:auto}
  .tagbtn{
    display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--border);
    color:#9aa4b8;font:inherit;font-size:11px;font-family:var(--mono);padding:3.5px 8px;border-radius:999px;cursor:pointer;
    transition:background .14s,color .14s,border-color .14s;max-width:100%;
  }
  .tagbtn:hover{color:var(--text);border-color:#2a3448}
  .tagbtn[aria-pressed="true"]{background:rgba(43,96,255,.16);border-color:rgba(43,96,255,.5);color:#cbd8ff}
  .tagbtn .n{opacity:.6;font-size:10px}
  .tagbtn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .selrow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11.5px;color:var(--muted)}
  .selrow label{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;color:#a9b2c6}
  .selrow .grow{flex:1 1 auto}
  input[type=checkbox].cb{
    appearance:none;width:15px;height:15px;border:1.5px solid #37425c;border-radius:4px;
    background:var(--bg);cursor:pointer;position:relative;margin:0;flex:0 0 auto;
    transition:background .12s,border-color .12s;
  }
  input[type=checkbox].cb:checked{background:var(--accent);border-color:var(--accent)}
  input[type=checkbox].cb:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(40deg)}
  input[type=checkbox].cb:indeterminate{background:var(--accent);border-color:var(--accent)}
  input[type=checkbox].cb:indeterminate::after{content:"";position:absolute;left:3px;top:6px;width:7px;height:1.8px;background:#fff}
  input[type=checkbox].cb:disabled{opacity:.4;cursor:not-allowed}
  /* ---------- list ---------- */
  .list{flex:1 1 auto;overflow-y:auto;padding:0 0 18px}
  /* scoped so mermaid's own svg .row can never collide */
  #list .row{
    display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;
    padding:10px 12px 10px 11px;border-bottom:1px solid var(--border-soft);position:relative;transition:background .14s;
  }
  #list .row:hover{background:rgba(255,255,255,.028)}
  #list .row.active{background:linear-gradient(90deg,var(--accent-soft),rgba(43,96,255,.04))}
  #list .row.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  #list .row.dim{opacity:.5}
  #list .row.dim .row-title{text-decoration:line-through;text-decoration-color:#5e677d}
  #list .row-body{min-width:0;cursor:pointer;outline:none;border-radius:6px}
  #list .row-body:focus-visible{box-shadow:0 0 0 2px rgba(43,96,255,.5)}
  #list .chk{display:flex;align-items:center;justify-content:center;width:20px;height:20px;margin-top:1px}
  #list .row-title{font-size:13.6px;font-weight:540;line-height:1.4;color:#dfe3ec;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  #list .row.active .row-title{color:#fff}
  #list .row-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  #list .row-meta{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:11px;color:var(--muted);font-family:var(--mono);flex-wrap:wrap}
  #list .row-meta .dot{width:3px;height:3px;border-radius:50%;background:#3a445c;flex:0 0 auto}
  #list .row-meta .host,#list .row-meta .proj{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
  #list .row-act{position:absolute;right:8px;top:8px;opacity:0;transition:opacity .14s}
  #list .row:hover .row-act,#list .row:focus-within .row-act{opacity:1}
  #list .row-act .btn{padding:4px 7px;font-size:11px}

  .tagchip{font-size:10.5px;font-family:var(--mono);color:#9fd0ff;background:rgba(43,96,255,.10);border:1px solid rgba(43,96,255,.24);border-radius:999px;padding:1.5px 7px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .badge{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;font:600 10px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:999px;border:1px solid transparent}
  .badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .badge.approved{color:var(--ok);background:var(--ok-soft);border-color:rgba(62,207,142,.28)}
  .badge.denied{color:var(--bad);background:var(--bad-soft);border-color:rgba(255,107,107,.28)}
  .badge.other{color:#9aa4b8;background:rgba(139,147,167,.10);border-color:rgba(139,147,167,.24)}
  .badge.feedback{color:var(--warn);background:var(--warn-soft);border-color:rgba(245,181,68,.28)}
  .badge.deleted{color:var(--bad);background:var(--bad-soft);border-color:rgba(255,107,107,.28)}
  .badge.source,.badge.host{color:#a9b2c6;background:rgba(139,147,167,.10);border-color:rgba(139,147,167,.22)}
  .badge.project{color:var(--purple);background:rgba(169,139,255,.10);border-color:rgba(169,139,255,.26)}

  .skeleton{padding:12px 14px;border-bottom:1px solid var(--border-soft)}
  .skeleton i{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,#1a2130,#242d40,#1a2130);background-size:200% 100%;animation:shimmer 1.3s infinite}
  .skeleton i:nth-child(1){width:78%}
  .skeleton i:nth-child(2){width:45%;margin-top:9px;height:7px}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .empty{padding:34px 20px;text-align:center;color:var(--muted)}
  .empty .mark{display:inline-flex;color:#3a4560;margin-bottom:10px}
  .empty .big{font-size:14px;color:#aab2c4;font-weight:560;margin-bottom:6px}
  .empty .small{font-size:12.5px;line-height:1.6;max-width:290px;margin:0 auto}

  /* ---------- bulk bar ---------- */
  .bulk{flex:0 0 auto;border-top:1px solid var(--border);background:var(--panel-2);padding:10px 12px}
  .bulk .brow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .bulk .sel{font-size:12px;color:#e6e9ef;font-weight:560;margin-right:auto;white-space:nowrap}
  .bulk .hint{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.5}
  .bulk .panel{margin-top:9px;border-top:1px solid var(--border-soft);padding-top:9px}
  .bulk.confirming{background:rgba(255,107,107,.06)}

  /* ---------- buttons / inputs ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);
    color:var(--muted);font:inherit;font-size:12.5px;font-weight:540;padding:7px 11px;border-radius:9px;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;white-space:nowrap;
  }
  .btn:hover{color:var(--text);border-color:#2c374d;background:#161d2b}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:rgba(43,96,255,.5);color:#cbd8ff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
  .btn.primary{border-color:rgba(43,96,255,.5);color:#cbd8ff;background:var(--accent-soft)}
  .btn.primary:hover{background:rgba(43,96,255,.24);color:#e2eaff;border-color:rgba(43,96,255,.7)}
  .btn.ok{border-color:rgba(62,207,142,.4);color:#8fe6bd;background:var(--ok-soft)}
  .btn.ok:hover{background:rgba(62,207,142,.2);color:#b6f0d6}
  .btn.danger{border-color:rgba(255,107,107,.35);color:#ffa8a8;background:var(--bad-soft)}
  .btn.danger:hover{background:rgba(255,107,107,.2);color:#ffc9c9;border-color:rgba(255,107,107,.55)}
  .btn .ico{opacity:.85;flex:0 0 auto}
  .btn .spin{width:11px;height:11px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:currentColor;animation:spin .7s linear infinite}
  .inp{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font:inherit;font-size:12.5px;padding:7px 9px;border-radius:8px;outline:none;font-family:var(--mono)}
  .inp:focus{border-color:#33507f;box-shadow:0 0 0 3px var(--accent-soft)}
  /* ---------- viewer ---------- */
  .viewer{min-height:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
  .viewer::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(680px 320px at 80% -10%,rgba(43,96,255,.10),transparent 70%)}
  .viewer-head{
    flex:0 0 auto;position:relative;z-index:5;padding:14px 30px 13px;border-bottom:1px solid var(--border);
    background:rgba(11,14,20,.86);backdrop-filter:blur(10px);max-height:54vh;overflow-y:auto;
  }
  .viewer-head-top{display:flex;align-items:flex-start;gap:12px}
  .viewer-title{font-size:18.5px;font-weight:640;line-height:1.32;letter-spacing:-.008em;margin:0;flex:1 1 auto;min-width:0;word-break:break-word}
  .viewer-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
  .viewer-meta .dot{width:3px;height:3px;border-radius:50%;background:#3a445c}
  .viewer-meta .path{max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .viewer-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto;max-width:min(100%,560px)}

  .action-result{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.55;border-radius:10px;padding:9px 11px;border:1px solid var(--border);margin-top:10px}
  .action-result .ico{margin-top:2px;flex:0 0 auto}
  .action-result.ok{color:#b6f0d6;background:var(--ok-soft);border-color:rgba(62,207,142,.3)}
  .action-result.warn{color:#ffd9a0;background:var(--warn-soft);border-color:rgba(245,181,68,.32)}
  .action-result.err{color:#ffb0b0;background:var(--bad-soft);border-color:rgba(255,107,107,.32)}
  .action-result a{color:inherit;font-weight:560}
  .action-result code{font-family:var(--mono);background:rgba(255,255,255,.07);border-radius:5px;padding:1px 5px;font-size:11.5px}

  .confirm{margin-top:10px;border:1px solid rgba(245,181,68,.35);background:var(--warn-soft);border-radius:11px;padding:11px 12px}
  .confirm .ct{font-size:13px;color:#ffe6bd;font-weight:560;margin-bottom:5px}
  .confirm .cd{font-size:12.5px;color:#dcd0b4;line-height:1.55;margin-bottom:9px}
  .confirm.danger{border-color:rgba(255,107,107,.4);background:var(--bad-soft)}
  .confirm.danger .ct{color:#ffc9c9}
  .confirm.danger .cd{color:#e2b8b8}
  .confirm .cbtns{display:flex;gap:7px;flex-wrap:wrap}

  /* ---------- editors ---------- */
  .editor{border-bottom:1px solid var(--border);background:var(--panel-2);padding:13px 15px 15px;flex:0 0 auto;max-height:70vh;overflow-y:auto}
  .editor .etitle{font:600 11px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:11px;display:flex;align-items:center;gap:8px}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
  .field>label{font:600 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .field input[type=text],.field textarea{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    font:inherit;font-size:13.5px;border-radius:9px;padding:8px 10px;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .field textarea{min-height:74px;resize:vertical;line-height:1.6;font-size:13px}
  .field input:focus,.field textarea:focus{border-color:#33507f;box-shadow:0 0 0 3px var(--accent-soft)}
  .field .hint{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
  .editor-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px;align-items:center}
  .dirtydot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:2px}

  .tagedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--border);background:var(--bg);border-radius:9px;padding:6px 8px;min-height:38px}
  .tagedit:focus-within{border-color:#33507f;box-shadow:0 0 0 3px var(--accent-soft)}
  .tagedit .t{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-family:var(--mono);background:rgba(43,96,255,.12);border:1px solid rgba(43,96,255,.3);color:#bcd0ff;border-radius:999px;padding:2.5px 5px 2.5px 8px;max-width:100%}
  .tagedit .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tagedit .t button{background:none;border:0;color:inherit;cursor:pointer;font-size:13px;line-height:1;padding:0 2px;opacity:.7}
  .tagedit .t button:hover{opacity:1}
  .tagedit input{flex:1 1 100px;min-width:100px;background:none;border:0;outline:none;color:var(--text);font:inherit;font-size:12.5px;font-family:var(--mono)}
  .tagedit input::placeholder{color:#5e677d}
  .md-edit{
    width:100%;min-height:44vh;font-family:var(--mono);font-size:12.6px;line-height:1.62;
    background:var(--code-bg);border:1px solid var(--border);border-radius:11px;color:#c9d3e6;
    padding:13px;resize:vertical;outline:none;tab-size:2;
  }
  .md-edit:focus{border-color:#33507f;box-shadow:0 0 0 3px var(--accent-soft)}

  /* ---------- document ---------- */
  .doc-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;position:relative;z-index:1}
  .doc{max-width:820px;margin:0 auto;padding:32px 30px 120px}
  .md{line-height:1.75;font-size:15.2px;color:#dfe3ec;animation:fadeUp .28s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .md>*:first-child{margin-top:0}
  .md h1{font-size:25px;line-height:1.28;font-weight:650;letter-spacing:-.014em;margin:0 0 .5em;color:#fff}
  .md h2{font-size:19px;font-weight:620;letter-spacing:-.008em;margin:1.9em 0 .7em;padding-bottom:.34em;border-bottom:1px solid var(--border);color:#f0f2f7}

  .md pre[data-lang]::before{content:attr(data-lang);position:absolute;top:9px;right:13px;font:600 9.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:#5f6a82}
  .md pre[data-lang] code{padding-top:2px}
  .md blockquote{margin:1.05em 0;padding:.7em 1.15em;border-left:3px solid var(--accent);background:rgba(43,96,255,.055);border-radius:0 10px 10px 0;color:#c7cfdd}

  .md blockquote>*:last-child{margin-bottom:0}
  .md .callout{border-left-width:3px;padding-top:.85em}

  .md .callout .callout-label .mark{font-size:12px}
  .md .callout-note{border-left-color:var(--link);background:rgba(111,155,255,.07)}
  .md .callout-note .callout-label{color:var(--link)}
  .md .callout-tip{border-left-color:var(--ok);background:var(--ok-soft)}
  .md .callout-tip .callout-label{color:var(--ok)}
  .md .callout-important{border-left-color:var(--purple);background:rgba(169,139,255,.09)}
  .md .callout-important .callout-label{color:var(--purple)}
  .md .callout-warning{border-left-color:var(--warn);background:var(--warn-soft)}
  .md .callout-warning .callout-label{color:var(--warn)}
  .md .callout-caution{border-left-color:var(--bad);background:var(--bad-soft)}
  .md .callout-caution .callout-label{color:var(--bad)}
  .md .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:11px;margin:1.1em 0;background:var(--panel-2)}
  .md table{width:100%;border-collapse:collapse;font-size:13.3px;line-height:1.5}
  .md th{text-align:left;font-weight:620;color:#eaeef6;background:#151b28;padding:10px 13px;border-bottom:1px solid var(--border);white-space:nowrap}
  .md td{padding:9px 13px;border-bottom:1px solid var(--border-soft);vertical-align:top;color:#d3d9e5}
  .md tr:last-child td{border-bottom:none}
  .md tbody tr:hover{background:rgba(255,255,255,.02)}
  .md .task-list-item{list-style:none;margin-left:-1.3em}
  .md .task-list-item input{margin-right:.5em;accent-color:var(--accent)}
  .md .mermaid{background:#0e1420;border:1px solid var(--border);border-radius:12px;padding:20px 18px;margin:1.2em 0;display:flex;justify-content:center;overflow-x:auto}
  .md .mermaid svg{max-width:100%;height:auto}
  .md .mermaid-failed{background:#150f16;border:1px solid #3a2430;border-radius:12px;padding:0;margin:1.2em 0;overflow:hidden}
  .md .mermaid-failed .mermaid-src{margin:0;border:0;border-bottom:1px solid #3a2430;border-radius:0;background:#0d0a12}
  .md .mermaid-error{padding:11px 15px;font-size:12.5px;color:#ffb0b0;display:flex;gap:8px;align-items:flex-start;line-height:1.5}

  .note-box{max-width:820px;margin:18px auto -6px;padding:0 30px}
  .note-box .inner{display:flex;gap:9px;border:1px solid rgba(245,181,68,.3);background:var(--warn-soft);border-radius:11px;padding:10px 12px;font-size:13px;color:#f0dcb8;line-height:1.6}
  .note-box .inner .ico{margin-top:2px;flex:0 0 auto;color:var(--warn)}

  .raw-wrap{max-width:900px;margin:0 auto;padding:28px 30px 120px}
  .raw-bar{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .raw-pre{background:var(--code-bg);border:1px solid var(--border);border-radius:12px;padding:18px;overflow:auto;margin:0;font-family:var(--mono);font-size:12.7px;line-height:1.7;color:#c9d3e6;white-space:pre}

  .state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 30px;color:var(--muted);min-height:60vh;gap:13px}
  .state .big{font-size:15px;color:#c3cad9;font-weight:580}
  .state .small{font-size:13px;line-height:1.65;max-width:440px}
  .state .icon{width:40px;height:40px;color:#3a4560}
  .spinner{width:26px;height:26px;border-radius:50%;border:2.5px solid #232c3e;border-top-color:var(--accent);animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .mobile-back{display:none}

  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:#141b28;
    border:1px solid var(--border);border-radius:11px;padding:10px 14px;font-size:13px;
    box-shadow:0 14px 40px rgba(0,0,0,.55);display:flex;gap:10px;align-items:center;
    max-width:min(92vw,620px);line-height:1.5;animation:toastIn .22s ease both;
  }
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  .toast.ok{border-color:rgba(62,207,142,.4)}
  .toast.warn{border-color:rgba(245,181,68,.4)}
  .toast.err{border-color:rgba(255,107,107,.4)}
  .toast a{color:var(--link);font-weight:560}
  .toast .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}

  @media (max-width:900px){ :root{--side-w:310px} }
  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .viewer{display:none}
    body.showing-detail .sidebar{display:none}
    body.showing-detail .viewer{display:flex}

  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }

<script>

  function fmtBytes(n){
    if(!n) return "";
    if(n < 1024) return n + " B";
    if(n < 1048576) return (n/1024).toFixed(n < 10240 ? 1 : 0) + " KB";
    return (n/1048576).toFixed(1) + " MB";
  }
  function fmtDate(d){
    if(!d) return "";
    var iso = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
    var dt = iso ? new Date(+iso[1], +iso[2]-1, +iso[3]) : new Date(d);

    return dt.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"2-digit"});
  }
  function relTime(iso){
    if(!iso) return "";
    var t = Date.parse(iso);
    if(isNaN(t)) return "";
    var s = Math.max(0, (Date.now() - t) / 1000);
    if(s < 60) return "just now";
    if(s < 3600) return Math.floor(s/60) + "m ago";

  function selCount(map){ var n = 0; for(var k in map){ if(map[k]) n++; } return n; }

  function sanitize(html){
    var tpl = document.createElement("template");
    tpl.innerHTML = html;
    walk(tpl.content);
    return tpl.innerHTML;
    function walk(root){
      var nodes = Array.prototype.slice.call(root.children);
      for(var i=0;i<nodes.length;i++){
        var node = nodes[i];
        var tag = node.tagName.toLowerCase();
        if(BLOCKED[tag]){ node.remove(); continue; }
        var attrs = Array.prototype.slice.call(node.attributes);
        for(var j=0;j<attrs.length;j++){
          var name = attrs[j].name, val = attrs[j].value, ln = name.toLowerCase();
          if(ln.indexOf("on") === 0){ node.removeAttribute(name); continue; }
          if(ln === "srcdoc"){ node.removeAttribute(name); continue; }
          if(ln === "href" || ln === "src" || ln === "xlink:href"){
            var v = String(val).replace(/[\u0000-\u0020]/g, "");
            var bad = /^(javascript|vbscript|file):/i.test(v) ||
                      (/^data:/i.test(v) && !(ln === "src" && /^data:image\//i.test(v)));
            if(bad) node.removeAttribute(name);
          }
        }

          node.setAttribute("rel","noopener noreferrer");
          node.setAttribute("target","_blank");
        }
        walk(node);

  function buildMarkdownDom(md){

    }
    var root = el("div","md");
    root.innerHTML = sanitize(window.marked.parse(md));

    Array.prototype.slice.call(root.querySelectorAll("pre > code.language-mermaid")).forEach(function(code){
      var pre = code.parentElement;

      d.dataset.source = code.textContent;
      d.textContent = code.textContent;

    Array.prototype.slice.call(root.querySelectorAll("pre > code")).forEach(function(code){
      var pre = code.parentElement;
      var m = /language-([\w+#-]+)/i.exec(code.className || "");
      if(m) pre.dataset.lang = m[1].toLowerCase();

    Array.prototype.slice.call(root.querySelectorAll("table")).forEach(function(t){
      var wrap = el("div","table-wrap");

  function failMermaid(node, msg){

  function runMermaid(root){
    var nodes = Array.prototype.slice.call(root.querySelectorAll(".mermaid"));
    if(!nodes.length) return;
    if(!mermaidReady || !window.mermaid){
      nodes.forEach(function(n){ failMermaid(n, "Mermaid library unavailable"); });
      return;
    }
    var good = [];
    Promise.all(nodes.map(function(n){
      var src = n.dataset.source || n.textContent || "";
      return Promise.resolve()
        .then(function(){ return window.mermaid.parse(src); })
        .then(function(){ good.push(n); })
        .catch(function(err){ failMermaid(n, (err && err.message) ? err.message : "invalid diagram syntax"); });

  function archivePreTag(){

      if(!ui.showDeleted && m.deleted) return false;
      if(ui.status !== "all" && normStatus(m.status) !== ui.status) return false;
      if(q){
        var hay = [m.title, m.project, m.slug, m.host, m.note, m.originFilename, (m.tags||[]).join(" ")]
                    .join(" ").toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    return list.slice().sort(function(a,b){
      return String(b.archivedAt || "").localeCompare(String(a.archivedAt || ""));
    });

  function archiveFiltered(){

      els.statePanel.appendChild(el("div","spinner"));
      els.statePanel.appendChild(el("div","big", title || "Loading\u2026"));
      return;
    }
    var ico = icon(kind === "error" ? ICON.warn : ICON.info, 40, 1.6);
    ico.setAttribute("class","icon");
    els.statePanel.appendChild(ico);
    els.statePanel.appendChild(el("div","big", title || ""));
    if(detail) els.statePanel.appendChild(el("div","small", detail));
  }
  function metaBits(parts){
    var m = el("div","viewer-meta");
    parts.forEach(function(p){
      if(p == null || p === "") return;
      if(m.children.length) m.appendChild(el("span","dot"));
      if(typeof p === "string" || typeof p === "number") m.appendChild(el("span", null, String(p)));
      else m.appendChild(p);
    });
    return m;
  }
  function confirmPanel(title, detail, confirmLabel, danger, onOk, onCancel){
    var c = el("div","confirm" + (danger ? " danger" : ""));
    c.appendChild(el("div","ct", title));
    c.appendChild(el("div","cd", detail));
    var row = el("div","cbtns");
    row.appendChild(btn(confirmLabel, "sm " + (danger ? "danger" : "primary"), null, onOk));
    row.appendChild(btn("Cancel","sm", null, onCancel));
    c.appendChild(row);

  function resultPanel(r){
    var box = el("div","action-result " + (r.kind || "ok"));
    box.appendChild(icon(r.kind === "ok" ? ICON.check : ICON.warn, 15));
    var body = el("div");
    body.appendChild(document.createTextNode(r.text || ""));
    if(r.links && r.links.length){
      r.links.forEach(function(l, i){
        body.appendChild(document.createTextNode(i === 0 ? " " : " \u00b7 "));

        a.href = l.href;
        a.addEventListener("click", function(e){
          if(l.internal){ e.preventDefault(); location.hash = l.href; }

        body.appendChild(a);

  function renderViewer(){
    if(state.view === "archive") renderArchiveViewer(); else renderWsViewer();
  }

  /* ================= archive viewer ================= */
  function renderArchiveViewer(){
    var id = state.aUi.activeId;
    if(state.edit.mode !== "view") renderEditor();

    if(!id){
      els.viewerHead.hidden = true;
      els.viewerHead.textContent = "";
      els.editor.hidden = true;
      showState("info","Select a plan",
        "Pick an archived plan to read it here, edit its name, note, tags or markdown, or re-open and apply it.");
      return;
    }
    var m = findArchive(id);
    if(!m){
      els.viewerHead.hidden = true;
      els.viewerHead.textContent = "";
      els.editor.hidden = true;
      showState("info","Select a plan","That entry is no longer in the archive.");
      return;
    }

    els.viewerHead.hidden = false;
    els.viewerHead.textContent = "";

    var top = el("div","viewer-head-top");
    top.appendChild(btn("List","sm mobile-back", null, function(){ document.body.classList.remove("showing-detail"); }));
    top.appendChild(el("h2","viewer-title", m.title || m.slug || m.originFilename));

    var actions = el("div","viewer-actions");
    var rawBtn = btn("Raw","sm", ICON.code, function(){
      state.doc.showRaw = !state.doc.showRaw;
      renderArchiveViewer();
    });
    rawBtn.setAttribute("aria-pressed", String(!!state.doc.showRaw));
    actions.appendChild(rawBtn);
    actions.appendChild(btn("Edit details","sm", ICON.edit, function(){ openEditor("details"); }));
    actions.appendChild(btn("Edit markdown","sm", ICON.edit, function(){ openEditor("markdown"); }));
    actions.appendChild(btn("Re-open","sm primary", ICON.play, function(){
      state.act.confirm = "reopen"; state.act.result = null; renderArchiveViewer();
    }));
    actions.appendChild(btn("Apply","sm", ICON.rocket, function(){
      state.act.confirm = "apply"; state.act.result = null; renderArchiveViewer();
    }));
    top.appendChild(actions);
    els.viewerHead.appendChild(top);

    var bits = [];
    statusBadges({kind:m.kind, originFilename:m.originFilename}, m.status).forEach(function(b){ bits.push(b); });
    if(m.deleted) bits.push(el("span","badge deleted","deleted"));
    if(m.project) bits.push(el("span","badge project", m.project));
    if(m.host) bits.push(el("span","badge host", m.host));
    bits.push(el("span","badge source", m.source === "live" ? "live" : "import"));
    bits.push(fmtDate(m.date));
    if(m.size) bits.push(fmtBytes(m.size));
    bits.push("archived " + relTime(m.archivedAt));
    if(m.updatedAt && m.updatedAt !== m.archivedAt) bits.push("edited " + relTime(m.updatedAt));
    var pathEl = el("span","path", m.originFilename || m.id);
    pathEl.title = (m.originFilename || "") + "  \u00b7  id " + m.id;
    bits.push(pathEl);
    els.viewerHead.appendChild(metaBits(bits));

    if(state.act.confirm === "reopen"){
      els.viewerHead.appendChild(confirmPanel(
        "Start a live review from this stored plan?",
        "This opens a Plannotator review on the workstation using the archived markdown. It will show up on the sessions page.",
        "Re-open", false,
        function(){ doReopen(m); },
        function(){ state.act.confirm = null; renderArchiveViewer(); }
      ));
    } else if(state.act.confirm === "apply"){
      els.viewerHead.appendChild(confirmPanel(
        "Hand this plan to the implementation agent?",
        "Apply sends the plan to the workstation\u2019s implementation agent \u2014 the thing that actually writes code. It will start real work from this plan.",
        "Apply plan", false,
        function(){ doApply(m); },
        function(){ state.act.confirm = null; renderArchiveViewer(); }
      ));
    } else if(state.act.result){
      els.viewerHead.appendChild(resultPanel(state.act.result));
    }

    if(!state.doc.showRaw){
      els.noteBox.hidden = !m.note;
      if(m.note){
        els.noteBox.textContent = "";
        var inner = el("div","inner");
        inner.appendChild(icon(ICON.warn, 15));
        inner.appendChild(el("div", null, m.note));
        els.noteBox.appendChild(inner);
      }
    } else {
      els.noteBox.hidden = true;
    }

    if(state.doc.loading){ showState("loading","Loading plan\u2026"); return; }
    if(state.doc.error){ showState("error","Couldn't load this plan", state.doc.error); return; }
    if(state.doc.key !== "a:" + id){ showState("loading","Loading plan\u2026"); return; }

    els.statePanel.hidden = true;
    if(state.doc.showRaw){
      els.doc.hidden = true;
      els.rawWrap.hidden = false;
      els.rawPre.textContent = state.doc.markdown;
    } else {
      els.rawWrap.hidden = true;
      els.doc.hidden = false;
      els.doc.textContent = "";
      var built = buildMarkdownDom(state.doc.markdown);
      els.doc.appendChild(built);
      void built.offsetWidth;
      runMermaid(els.doc);
    }
    els.docScroll.scrollTop = state.doc.scrollTop || 0;
  }

  /* ================= workstation viewer ================= */

    }

    els.viewerHead.textContent = "";

    var top = el("div","viewer-head-top");

    var actions = el("div","viewer-actions");
    var rawBtn = btn("Raw","sm", ICON.code, function(){
      state.doc.showRaw = !state.doc.showRaw;
      renderWsViewer();
    });

    actions.appendChild(rawBtn);

      importOne(p.host, p.filename, p.title);
    }));

    bits.push(el("span","badge host", p.hostLabel || p.host));

    if(p.size) bits.push(fmtBytes(p.size));

    if(state.doc.error){ showState("error","Couldn't load this plan", state.doc.error); return; }
    if(state.doc.key !== "w:" + key){ showState("loading","Loading plan\u2026"); return; }

    els.statePanel.hidden = true;
    if(state.doc.showRaw){
      els.doc.hidden = true;
      els.rawWrap.hidden = false;
      els.rawPre.textContent = state.doc.markdown;
    } else {
      els.rawWrap.hidden = true;
      els.doc.hidden = false;
      els.doc.textContent = "";
      var built = buildMarkdownDom(state.doc.markdown);
      els.doc.appendChild(built);
      void built.offsetWidth;
      runMermaid(els.doc);
    }
    els.docScroll.scrollTop = state.doc.scrollTop || 0;
  }
  /* ================= inline editor ================= */
  function blankDoc(){
    return { key:null, markdown:"", meta:null, loading:false, error:null, showRaw:false, scrollTop:0, seq:(state.doc && state.doc.seq) || 0 };
  }
  function closeEditor(){
    state.edit.mode = "view";
    state.edit.draft = null;
    state.edit.dirty = false;
    state.edit.saving = false;
    els.editor.hidden = true;
    els.editor.textContent = "";
  }
  function openEditor(mode){
    var m = findArchive(state.aUi.activeId);
    if(!m) return;
    state.edit.mode = mode;
    state.edit.dirty = false;
    state.edit.saving = false;
    state.edit.tagInput = "";
    state.edit.draft = {
      title: m.title || "",
      note: m.note || "",
      tags: (m.tags || []).slice(),
      markdown: state.doc.markdown || ""
    };
    renderEditor();
    var ta = $("edMd");
    if(ta) ta.focus();
  }
  function markDirty(){
    state.edit.dirty = true;
    var t = els.editor.querySelector(".etitle");
    if(t && !t.querySelector(".dirtydot")) t.appendChild(el("span","dirtydot"));
  }
  function focusTagInput(){
    var i = $("edTagInput");
    if(i){ i.focus(); try{ i.setSelectionRange(i.value.length, i.value.length); }catch(e){} }
  }
  function commitTagInput(){
    var d = state.edit.draft;
    if(!d) return;
    var raw = state.edit.tagInput || "";
    if(!raw) return;
    var added = false;
    raw.split(",").forEach(function(part){
      var t = part.replace(/\s+/g," ").trim().toLowerCase().slice(0,32);
      if(t && d.tags.indexOf(t) === -1 && d.tags.length < 20){ d.tags.push(t); added = true; }
    });
    state.edit.tagInput = "";
    if(added || raw){ markDirty(); renderEditor(); focusTagInput(); }
  }
  function buildTagEditor(){
    var d = state.edit.draft;
    var wrap = el("div","tagedit");
    d.tags.forEach(function(t, i){
      var chip = el("span","t");
      chip.appendChild(el("span", null, t));
      var x = el("button", null, "\u00d7");
      x.type = "button";
      x.setAttribute("aria-label","Remove tag " + t);
      x.addEventListener("click", function(){
        d.tags.splice(i,1);
        markDirty(); renderEditor(); focusTagInput();
      });
      chip.appendChild(x);
      wrap.appendChild(chip);
    });
    var inp = el("input");
    inp.id = "edTagInput";
    inp.placeholder = d.tags.length ? "add tag\u2026" : "add a tag\u2026";
    inp.value = state.edit.tagInput || "";
    inp.addEventListener("input", function(){ state.edit.tagInput = inp.value; });
    inp.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === ","){ e.preventDefault(); commitTagInput(); }
      else if(e.key === "Backspace" && !inp.value && d.tags.length){
        d.tags.pop(); markDirty(); renderEditor(); focusTagInput();
      }
    });
    inp.addEventListener("blur", function(){ if((state.edit.tagInput||"").trim()) commitTagInput(); });
    wrap.appendChild(inp);
    return wrap;
  }
  function renderEditor(){
    var m = findArchive(state.aUi.activeId);
    if(!m || state.edit.mode === "view"){
      els.editor.hidden = true;
      els.editor.textContent = "";
      return;
    }
    var d = state.edit.draft;
    els.editor.hidden = false;
    els.editor.textContent = "";

    var head = el("div","etitle");
    head.appendChild(document.createTextNode(state.edit.mode === "details" ? "Editing details" : "Editing markdown"));
    if(state.edit.dirty) head.appendChild(el("span","dirtydot"));
    els.editor.appendChild(head);

    if(state.edit.mode === "details"){
      var f1 = el("div","field");
      f1.appendChild(el("label", null, "Title"));
      var ti = el("input");
      ti.type = "text"; ti.id = "edTitle"; ti.value = d.title;
      ti.addEventListener("input", function(){ d.title = ti.value; markDirty(); });
      f1.appendChild(ti);
      els.editor.appendChild(f1);

      var f2 = el("div","field");
      f2.appendChild(el("label", null, "Note"));
      var nt = el("textarea");
      nt.id = "edNote"; nt.value = d.note;
      nt.placeholder = "Optional note. Shown above the plan when reading.";
      nt.addEventListener("input", function(){ d.note = nt.value; markDirty(); });
      f2.appendChild(nt);
      els.editor.appendChild(f2);

      var f3 = el("div","field");
      f3.appendChild(el("label", null, "Tags"));
      f3.appendChild(buildTagEditor());
      f3.appendChild(el("div","hint","Enter or comma to add \u00b7 up to 20 \u00b7 lowercased"));
      els.editor.appendChild(f3);
    } else {
      var f4 = el("div","field");
      f4.appendChild(el("label", null, "Markdown"));
      var ta = el("textarea","md-edit");
      ta.id = "edMd"; ta.value = d.markdown; ta.spellcheck = false;
      ta.addEventListener("input", function(){ d.markdown = ta.value; markDirty(); });
      ta.addEventListener("keydown", function(e){
        if(e.key === "Tab"){
          e.preventDefault();
          var s = ta.selectionStart, en = ta.selectionEnd;
          ta.value = ta.value.slice(0, s) + "  " + ta.value.slice(en);
          ta.selectionStart = ta.selectionEnd = s + 2;
          d.markdown = ta.value; markDirty();
        }
      });
      f4.appendChild(ta);
      els.editor.appendChild(f4);
    }

    var ar = el("div","editor-actions");
    var save = btn(state.edit.saving ? "Saving\u2026" : "Save", "sm primary", null, saveEditor);
    if(state.edit.saving){
      save.disabled = true;
      save.insertBefore(el("span","spin"), save.firstChild);
    }
    ar.appendChild(save);
    ar.appendChild(btn("Cancel","sm", null, function(){ closeEditor(); renderArchiveViewer(); }));
    if(state.edit.dirty) ar.appendChild(el("span","hint","unsaved changes"));
    els.editor.appendChild(ar);
  }
  function saveEditor(){
    var m = findArchive(state.aUi.activeId);
    if(!m || !state.edit.draft || state.edit.saving) return;
    var d = state.edit.draft;
    var wasMarkdown = state.edit.mode === "markdown";
    var payload = wasMarkdown
      ? { id:m.id, markdown:d.markdown }
      : { id:m.id, title:d.title, note:d.note, tags:d.tags.slice() };

    state.edit.saving = true;
    renderEditor();
    postJSON(API_A_UPDATE, payload).then(function(r){
      state.edit.saving = false;
      var b = r.body;
      if(!r.ok || !b || b.error){ toast("err","Save failed \u2014 " + postErr(r)); state.edit.dirty = true; renderEditor(); return; }
      if(wasMarkdown) state.doc.markdown = d.markdown;
      mergeMeta(b);
      closeEditor();
      renderArchiveViewer(); renderList(); renderControls();
      toast("ok", wasMarkdown ? "Markdown saved." : "Details saved.");
    }).catch(function(err){
      state.edit.saving = false;
      state.edit.dirty = true;
      toast("err","Save failed \u2014 " + (err && err.message ? err.message : "network error"));
      renderEditor();
    });
  }
  function mergeMeta(meta){
    if(!meta || !meta.id) return;
    for(var i=0;i<state.archive.plans.length;i++){
      if(state.archive.plans[i].id === meta.id){ state.archive.plans[i] = meta; return; }
    }
    state.archive.plans.unshift(meta);
  }

  /* ================= reopen / apply ================= */
  function doReopen(m){
    state.act.confirm = null;
    state.act.result = { kind:"warn", text:"Starting a live review\u2026" };
    renderArchiveViewer();
    postJSON(API_A_REOPEN, { id:m.id }).then(function(r){
      var b = r.body || {};
      if(r.ok && b.ok){
        var links = [];
        var url = b.url;
        if(!url && b.port && SUFFIX) url = "https://p" + b.port + "." + SUFFIX;
        if(url) links.push({ label:url, href:url });
        state.act.result = {
          kind:"ok",
          text:"Review is live on " + (b.host || "the workstation") +
               (b.file ? " (" + b.file + ")" : "") + " \u2014 it will appear on the sessions page.",
          links:links
        };
        toast("ok","Re-opened on " + (b.host || "workstation") + ".");
      } else {
        state.act.result = { kind:"err", text:"Could not re-open \u2014 " + ((b && b.error) || postErr(r)) };
      }
      renderArchiveViewer();
    }).catch(function(err){
      state.act.result = { kind:"err", text:"Could not re-open \u2014 " + (err && err.message ? err.message : "network error") };
      renderArchiveViewer();
    });
  }
  function doApply(m){
    state.act.confirm = null;
    state.act.result = { kind:"warn", text:"Handing the plan to the implementation agent\u2026" };
    renderArchiveViewer();
    postJSON(API_A_APPLY, { id:m.id }).then(function(r){
      var b = r.body || {};
      if(r.ok && b.ok){
        state.act.result = {
          kind:"ok",
          text:"Handed to the implementation agent on " + (b.host || "the workstation") +
               " \u2014 job " + (b.jobId || "(no id returned)") + "."
        };
        toast("ok","Apply started on " + (b.host || "workstation") + ".");
      } else {
        var msg = (b && b.error) || postErr(r);
        var notConfigured = /not configured|no workstation agents/i.test(msg);
        state.act.result = {
          kind: notConfigured ? "warn" : "err",
          text: notConfigured
            ? "Apply isn\u2019t configured on this hub \u2014 no workstation agents are set. (" + msg + ")"
            : "Apply failed \u2014 " + msg
        };
      }
      renderArchiveViewer();
    }).catch(function(err){
      state.act.result = { kind:"err", text:"Apply failed \u2014 " + (err && err.message ? err.message : "network error") };
      renderArchiveViewer();
    });
  }

  /* ================= bulk operations ================= */
  function bulkTagCommit(){
    if(state.view !== "archive") return;
    var map = state.aUi.selected;
    var ids = selKeys(map);
    var vals = String(state.bulk.value || "").split(",").map(function(s){ return s.trim(); }).filter(Boolean);
    if(!ids.length || !vals.length) return;
    var isAdd = state.bulk.panel === "addTag";
    var payload = { ids:ids };
    payload[isAdd ? "add" : "remove"] = vals;
    postJSON(API_A_TAG, payload).then(function(r){
      var b = r.body;
      if(!r.ok || !b || b.error){ toast("err","Tag update failed \u2014 " + postErr(r)); return; }
      (b.plans || []).forEach(mergeMeta);
      var missing = (b.missing || []).length;
      if(!isAdd) clearSel(map);
      state.bulk.panel = null;
      state.bulk.value = "";
      renderList(); renderBulk(); renderControls();
      if(state.aUi.activeId) renderArchiveViewer();
      loadArchive(true);
      toast(missing ? "warn" : "ok",
        (isAdd ? "Added " : "Removed ") + vals.join(", ") + " on " + (ids.length - missing) + " plan(s)." +
        (missing ? " " + missing + " missing." : ""));
    }).catch(function(err){ toast("err","Tag update failed \u2014 " + (err && err.message ? err.message : "network error")); });
  }
  function bulkSoftDelete(){
    var map = state.aUi.selected;
    var ids = selKeys(map);
    postJSON(API_A_DELETE, { ids:ids }).then(function(r){
      var b = r.body;
      if(!r.ok || !b || b.error){ toast("err","Delete failed \u2014 " + postErr(r)); return; }
      clearSel(map);
      state.bulk.panel = null;
      renderList(); renderBulk(); renderControls();
      loadArchive(true);
      toast("ok","Deleted " + (b.deleted || 0) + " plan(s). Turn on \u201cShow deleted\u201d to restore them.");
    }).catch(function(err){ toast("err","Delete failed \u2014 " + (err && err.message ? err.message : "network error")); });
  }
  function bulkRestore(){
    var map = state.aUi.selected;
    var ids = selKeys(map);
    postJSON(API_A_RESTORE, { ids:ids }).then(function(r){
      var b = r.body;
      if(!r.ok || !b || b.error){ toast("err","Restore failed \u2014 " + postErr(r)); return; }
      clearSel(map);
      state.bulk.panel = null;
      renderList(); renderBulk(); renderControls();
      loadArchive(true);
      toast("ok","Restored " + (b.restored || 0) + " plan(s).");
    }).catch(function(err){ toast("err","Restore failed \u2014 " + (err && err.message ? err.message : "network error")); });
  }
  function bulkHardDelete(){
    var map = state.aUi.selected;
    var ids = selKeys(map);
    postJSON(API_A_DELETE, { ids:ids, hard:true }).then(function(r){
      var b = r.body;
      if(!r.ok || !b || b.error){ toast("err","Hard delete failed \u2014 " + postErr(r)); return; }
      clearSel(map);
      state.bulk.panel = null;
      if(ids.indexOf(state.aUi.activeId) !== -1){
        state.aUi.activeId = null;
        state.doc = blankDoc();
        closeEditor();
      }
      renderList(); renderBulk(); renderControls(); renderArchiveViewer();
      loadArchive(true);
      toast("warn","Permanently deleted " + (b.deleted || 0) + " plan(s) and their markdown.");
    }).catch(function(err){ toast("err","Hard delete failed \u2014 " + (err && err.message ? err.message : "network error")); });
  }

  /* ================= import ================= */
  function importOne(host, filename, title){
    toast("warn","Importing " + (title || filename) + "\u2026");
    postJSON(API_A_IMPORT, { host:host, filename:filename }).then(function(r){
      var b = r.body || {};
      if(!r.ok || b.error || !b.id){ toast("err","Import failed \u2014 " + ((b && b.error) || postErr(r))); return; }
      var msg = b.created
        ? "Imported \u201c" + (title || filename) + "\u201d."
        : "\u201c" + (title || filename) + "\u201d was already archived.";
      toast("ok", msg, "Open in My archive \u2192", "#archive/" + encodeURIComponent(b.id));
      loadArchive(true);
    }).catch(function(err){ toast("err","Import failed \u2014 " + (err && err.message ? err.message : "network error")); });
  }
  function bulkImport(){
    var map = state.wUi.selected;
    var items = selKeys(map).map(findWs).filter(Boolean);
    if(!items.length) return;
    var created = 0, existing = 0, failed = 0, lastId = null, done = 0, idx = 0, running = 0, MAX = 4;
    toast("warn","Importing " + items.length + " plan(s)\u2026");
    return new Promise(function(resolve){
      function pump(){
        while(running < MAX && idx < items.length){
          var it = items[idx++];
          running++;
          postJSON(API_A_IMPORT, { host:it.host, filename:it.filename })
            .then(function(r){
              var b = r.body || {};
              if(!r.ok || b.error || !b.id) failed++;
              else { if(b.created) created++; else existing++; lastId = b.id; }
            })
            .catch(function(){ failed++; })
            .then(function(){
              running--; done++;
              if(done === items.length) resolve(); else pump();
            });
        }
      }
      pump();
    }).then(function(){
      clearSel(map);
      renderList(); renderBulk(); renderControls();
      loadArchive(true);
      var parts = [];
      if(created) parts.push("imported " + created);
      if(existing) parts.push(existing + " already archived");
      if(failed) parts.push(failed + " failed");
      if(!parts.length) parts.push("nothing to import");
      toast(failed ? (created || existing ? "warn" : "err") : "ok",
        parts.join(", ") + ".",
        lastId ? "Open in My archive \u2192" : null,
        lastId ? "#archive/" + encodeURIComponent(lastId) : null);
    });
  }

  /* ================= data loading ================= */
  function loadArchive(silent){
    if(!silent){ state.archive.loading = true; state.archive.error = null; }
    if(state.view === "archive"){ renderControls(); renderList(); }
    return getJSON(API_A_LIST + "?includeDeleted=1").then(function(res){
      state.archive.plans = res.plans || [];
      state.archive.tags = res.tags || [];
      state.archive.counts = res.counts || {};
      state.archive.loaded = true;
      state.archive.loading = false;
      state.archive.error = null;
      if(state.view === "archive"){
        renderChrome(); renderControls(); renderList(); renderBulk();
        /* never disturb an open editor: refreshing must not eat in-progress edits */
        if(state.edit.mode === "view" && state.aUi.activeId && state.doc.key === "a:" + state.aUi.activeId){
          renderArchiveViewer();
        }
      } else {
        renderChrome();
      }
    }).catch(function(err){
      state.archive.loading = false;
      state.archive.error = (err && err.message) ? err.message : "network error";
      if(state.view === "archive"){ renderChrome(); renderControls(); renderList(); }
    });
  }
  function loadWorkstation(silent){
    if(!silent){ state.ws.loading = true; state.ws.error = null; }
    if(state.view === "workstation"){ renderControls(); renderList(); }
    return getJSON(API_LIST).then(function(res){
      var plans = (res && Array.isArray(res.plans)) ? res.plans.slice() : [];
      plans.sort(function(a,b){
        var ta = a.timestamp ? Date.parse(a.timestamp) : 0;
        var tb = b.timestamp ? Date.parse(b.timestamp) : 0;
        if(ta && tb && ta !== tb) return tb - ta;
        return 0;
      });
      state.ws.plans = plans;
      state.ws.loaded = true;
      state.ws.loading = false;
      state.ws.error = null;
      if(state.view === "workstation"){
        renderChrome(); renderControls(); renderList(); renderBulk();
        if(state.wUi.activeKey && state.doc.key === "w:" + state.wUi.activeKey) renderWsViewer();
      } else {
        renderChrome(); renderControls();
      }
    }).catch(function(err){
      state.ws.loading = false;
      state.ws.error = (err && err.message) ? err.message : "network error";
      if(state.view === "workstation"){ renderChrome(); renderControls(); renderList(); }
      else renderChrome();
    });
  }
  function refreshCurrent(){
    var p = state.view === "archive" ? loadArchive() : loadWorkstation();
    return p.then(function(){
      if(state.view === "archive" ? !state.archive.error : !state.ws.error) toast("ok","Refreshed.");
      else toast("err","Refresh failed \u2014 the hub did not respond.");
    });
  }

  /* ================= selection + doc loading ================= */
  function loadArchiveDoc(id){
    var seq = ((state.doc && state.doc.seq) || 0) + 1;
    state.doc = { key:"a:" + id, markdown:"", meta:null, loading:true, error:null, showRaw:false, scrollTop:0, seq:seq };
    renderArchiveViewer();
    getJSON(API_A_GET + "?id=" + encodeURIComponent(id)).then(function(res){
      if(state.doc.seq !== seq || state.doc.key !== "a:" + id) return;
      state.doc.loading = false;
      state.doc.markdown = res.markdown || "";
      state.doc.meta = res.meta || null;
      if(res.meta) mergeMeta(res.meta);
      renderArchiveViewer();
    }).catch(function(err){
      if(state.doc.seq !== seq || state.doc.key !== "a:" + id) return;
      state.doc.loading = false;
      state.doc.error = "Request to " + API_A_GET + " failed (" + ((err && err.message) || "network error") + ").";
      renderArchiveViewer();
    });
  }
  function loadWsDoc(key){
    var p = findWs(key);
    if(!p) return;
    var seq = ((state.doc && state.doc.seq) || 0) + 1;
    state.doc = { key:"w:" + key, markdown:"", meta:null, loading:true, error:null, showRaw:false, scrollTop:0, seq:seq };
    renderWsViewer();
    var url = API_RAW + "?host=" + encodeURIComponent(p.host) + "&filename=" + encodeURIComponent(p.filename);
    getText(url).then(function(txt){
      if(state.doc.seq !== seq || state.doc.key !== "w:" + key) return;
      state.doc.loading = false;
      state.doc.markdown = txt;
      renderWsViewer();
    }).catch(function(err){
      if(state.doc.seq !== seq || state.doc.key !== "w:" + key) return;
      state.doc.loading = false;
      state.doc.error = "Request to " + url + " failed (" + ((err && err.message) || "network error") + ").";
      renderWsViewer();
    });
  }
  function selectArchive(id){
    state.aUi.activeId = id;
    state.act.confirm = null;
    state.act.result = null;
    state.bulk.panel = null;
    closeEditor();
    document.body.classList.add("showing-detail");
    renderList(); renderBulk();
    loadArchiveDoc(id);
    updateHash();
  }
  function selectWs(key){
    state.wUi.activeKey = key;
    state.act.result = null;
    closeEditor();
    document.body.classList.add("showing-detail");
    renderList(); renderBulk();
    loadWsDoc(key);
    updateHash();
  }

  /* ================= views + hash ================= */
  function switchView(view, noHash){
    if(state.view === view){
      renderChrome(); renderControls(); renderList(); renderBulk(); renderViewer();
      return;
    }
    if(state.view === "archive") state.aUi.scrollTop = els.list.scrollTop;
    else state.wUi.scrollTop = els.list.scrollTop;

    state.view = view;
    closeEditor();
    state.act.confirm = null;
    state.act.result = null;
    state.bulk.panel = null;
    document.body.classList.remove("showing-detail");

    renderChrome(); renderControls(); renderList(); renderBulk(); renderViewer();
    ensureDocLoaded();
    if(!noHash) updateHash();
  }
  function ensureDocLoaded(){
    if(state.view === "archive"){
      var id = state.aUi.activeId;
      if(!id){ state.doc = blankDoc(); renderArchiveViewer(); return; }
      if(state.doc.key !== "a:" + id) loadArchiveDoc(id);
    } else {
      var k = state.wUi.activeKey;
      if(!k){ state.doc = blankDoc(); renderWsViewer(); return; }
      if(state.doc.key !== "w:" + k) loadWsDoc(k);
    }
  }
  function updateHash(){
    var h;
    if(state.view === "archive"){
      h = "#archive" + (state.aUi.activeId ? "/" + encodeURIComponent(state.aUi.activeId) : "");
    } else {
      h = "#workstation" + (state.wUi.activeKey ? "/" + state.wUi.activeKey.split("/").map(encodeURIComponent).join("/") : "");
    }
    try{ history.replaceState(null, "", h); }catch(e){}
  }
  function applyHash(){
    var raw = location.hash.replace(/^#/, "");
    if(!raw) return;
    var parts = raw.split("/");
    var head = parts[0];
    if(head === "archive"){
      switchView("archive", true);
      if(parts.length > 1){
        var id = decodeURIComponent(parts.slice(1).join("/"));
        if(findArchive(id)) selectArchive(id);
      }
      return;
    }
    if(head === "workstation"){
      switchView("workstation", true);
      if(parts.length > 2){
        var key = decodeURIComponent(parts[1]) + "/" + decodeURIComponent(parts.slice(2).join("/"));
        if(findWs(key)) selectWs(key);
      }
      return;
    }
    /* legacy deep link from the read-only browser: #<host>/<filename> */
    if(parts.length > 1 && /^\d+\.\d+\.\d+\.\d+$/.test(head)){
      switchView("workstation", true);
      var lkey = decodeURIComponent(head) + "/" + decodeURIComponent(parts.slice(1).join("/"));
      if(findWs(lkey)) selectWs(lkey);
    }
  }

  /* ================= events ================= */
  function activeSearch(){ return state.view === "archive" ? els.aSearch : els.wSearch; }
  function toggleRowSel(row, checked){
    var isA = row.dataset.kind === "archive";
    var map = isA ? state.aUi.selected : state.wUi.selected;
    var k = isA ? row.dataset.id : row.dataset.key;
    if(checked) map[k] = true; else delete map[k];
    renderBulk(); renderControls();
  }
  function activateRow(row){
    if(row.dataset.kind === "archive") selectArchive(row.dataset.id);
    else selectWs(row.dataset.key);
  }

  els.tabArchive.addEventListener("click", function(){ switchView("archive"); });
  els.tabWs.addEventListener("click", function(){
    var first = !state.ws.loaded;
    switchView("workstation");
    if(first) loadWorkstation();
  });
  els.refreshBtn.addEventListener("click", function(){ refreshCurrent(); });

  var aTimer = null;
  els.aSearch.addEventListener("input", function(){
    clearTimeout(aTimer);
    aTimer = setTimeout(function(){
      state.aUi.query = els.aSearch.value;
      renderArchiveControls(); renderList();
    }, 120);
  });
  var wTimer = null;
  els.wSearch.addEventListener("input", function(){
    clearTimeout(wTimer);
    wTimer = setTimeout(function(){
      state.wUi.query = els.wSearch.value;
      renderWsControls(); renderList();
    }, 120);
  });
  Array.prototype.slice.call(document.querySelectorAll("[data-astatus]")).forEach(function(c){
    c.addEventListener("click", function(){
      state.aUi.status = c.dataset.astatus;
      Array.prototype.slice.call(document.querySelectorAll("[data-astatus]")).forEach(function(o){
        o.setAttribute("aria-pressed", String(o.dataset.astatus === state.aUi.status));
      });
      renderArchiveControls(); renderList();
    });
  });
  Array.prototype.slice.call(document.querySelectorAll("[data-wstatus]")).forEach(function(c){
    c.addEventListener("click", function(){
      state.wUi.status = c.dataset.wstatus;
      Array.prototype.slice.call(document.querySelectorAll("[data-wstatus]")).forEach(function(o){
        o.setAttribute("aria-pressed", String(o.dataset.wstatus === state.wUi.status));
      });
      renderWsControls(); renderList();
    });
  });
  els.showDeletedBtn.addEventListener("click", function(){
    state.aUi.showDeleted = !state.aUi.showDeleted;
    renderArchiveControls(); renderList();
  });
  Array.prototype.slice.call(els.tagMode.querySelectorAll("button")).forEach(function(b){
    b.addEventListener("click", function(){
      state.aUi.tagMode = b.dataset.tagmode;
      renderArchiveControls(); renderList();
    });
  });
  els.clearTags.addEventListener("click", function(){
    state.aUi.tags = [];
    renderArchiveControls(); renderList();
    updateHash();
  });
  els.aSelectAll.addEventListener("change", function(){
    var on = els.aSelectAll.checked;
    var list = archiveFiltered();
    list.forEach(function(m){ if(on) state.aUi.selected[m.id] = true; else delete state.aUi.selected[m.id]; });
    renderList(); renderBulk(); renderControls();
  });
  els.wSelectAll.addEventListener("change", function(){
    var on = els.wSelectAll.checked;
    var list = wsFiltered();
    list.forEach(function(p){ var k = wsKey(p); if(on) state.wUi.selected[k] = true; else delete state.wUi.selected[k]; });
    renderList(); renderBulk(); renderControls();
  });

  els.list.addEventListener("click", function(e){
    var row = e.target && e.target.closest ? e.target.closest(".row") : null;
    if(!row) return;
    var cb = e.target.closest("input.cb");
    if(cb){ toggleRowSel(row, cb.checked); return; }
    if(e.target.closest(".row-act")) return;
    activateRow(row);
  });
  els.list.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){
      var body = e.target.closest ? e.target.closest(".row-body") : null;
      if(body){
        e.preventDefault();
        activateRow(body.closest(".row"));
      }
    } else if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      var list = state.view === "archive" ? archiveFiltered() : wsFiltered();
      if(!list.length) return;
      var cur = state.view === "archive" ? state.aUi.activeId : state.wUi.activeKey;
      var idx = -1;
      for(var i=0;i<list.length;i++){
        var k = state.view === "archive" ? list[i].id : wsKey(list[i]);
        if(k === cur){ idx = i; break; }
      }
      var next = e.key === "ArrowDown" ? Math.min(list.length - 1, idx + 1) : Math.max(0, (idx < 0 ? 0 : idx - 1));
      if(state.view === "archive") selectArchive(list[next].id); else selectWs(wsKey(list[next]));
      var active = els.list.querySelector('.row.active');
      if(active) active.scrollIntoView({ block:"nearest" });
    }
  });
  els.list.addEventListener("scroll", function(){
    if(state.view === "archive") state.aUi.scrollTop = els.list.scrollTop;
    else state.wUi.scrollTop = els.list.scrollTop;
  });
  els.docScroll.addEventListener("scroll", function(){ state.doc.scrollTop = els.docScroll.scrollTop; });

  document.addEventListener("keydown", function(e){
    var tag = (e.target && e.target.tagName || "").toLowerCase();
    var typing = tag === "input" || tag === "textarea";
    if(e.key === "/" && !typing){
      e.preventDefault();
      var s = activeSearch();
      s.focus(); s.select();
    } else if(e.key === "Escape" && state.edit.mode !== "view" && !typing){
      closeEditor(); renderViewer();
    }
  });
  window.addEventListener("hashchange", function(){ applyHash(); });

  /* ================= boot ================= */
  renderChrome(); renderControls(); renderList(); renderBulk(); renderViewer();
  loadArchive().then(function(){ return loadWorkstation(true); }).then(function(){ applyHash(); });
})();
</script>
</body>
</html>
