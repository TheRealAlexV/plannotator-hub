<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Plannotator sessions</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e14'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%232b60ff' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%233ecf8e'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0e14;
    --panel:#121722;
    --panel-2:#0e131d;
    --border:#1e2636;
    --border-soft:#171e2b;
    --text:#e6e9ef;
    --muted:#8b93a7;
    --accent:#2b60ff;
    --accent-soft:rgba(43,96,255,.14);
    --link:#6f9bff;
    --code-bg:#0a0d13;
    --code-inline:#1a2030;
    --ok:#3ecf8e;
    --ok-soft:rgba(62,207,142,.12);
    --bad:#ff6b6b;
    --bad-soft:rgba(255,107,107,.12);
    --warn:#f5b544;
    --warn-soft:rgba(245,181,68,.13);
    --purple:#a98bff;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --topbar-h:56px;
    --side-w:348px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  }
  ::selection{background:rgba(43,96,255,.35)}
  a{color:var(--link)}

  /* ---------- scrollbars ---------- */
  .scroll{scrollbar-width:thin;scrollbar-color:#2a3346 transparent}
  .scroll::-webkit-scrollbar{width:10px;height:10px}
  .scroll::-webkit-scrollbar-thumb{background:#252d3f;border:3px solid transparent;background-clip:content-box;border-radius:8px}
  .scroll::-webkit-scrollbar-thumb:hover{background:#33405a;background-clip:content-box}
  .scroll::-webkit-scrollbar-track{background:transparent}

  /* ---------- top bar ---------- */
  .topbar{
    flex:0 0 auto;height:var(--topbar-h);display:flex;align-items:center;gap:12px;
    padding:0 18px;border-bottom:1px solid var(--border);
    background:rgba(11,14,20,.82);backdrop-filter:blur(10px);
    position:relative;z-index:30;
  }
  .topbar::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(43,96,255,.5),transparent);
    opacity:.5;pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand svg{flex:0 0 auto;display:block}
  .brand h1{font-size:15px;font-weight:640;letter-spacing:.01em;margin:0;white-space:nowrap}
  .brand .sub{color:var(--muted);font-size:12.5px;font-family:var(--mono);padding-left:2px}
  .topbar .spacer{flex:1 1 auto}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);
    font-size:13.5px;font-weight:520;padding:7px 12px;border-radius:9px;border:1px solid transparent;
    transition:background .16s,color .16s,border-color .16s;
  }
  .back-link:hover{color:var(--text);background:var(--panel);border-color:var(--border)}
  .back-link svg{transition:transform .16s}
  .back-link:hover svg{transform:translateX(2px)}

  /* ---------- layout ---------- */
  .app{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr)}

  /* ---------- sidebar ---------- */
  .sidebar{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--panel)}
  .side-head{flex:0 0 auto;padding:14px 14px 11px;border-bottom:1px solid var(--border)}
  .search{position:relative;display:flex;align-items:center}
  .search svg{position:absolute;left:11px;color:var(--muted);pointer-events:none}
  .search input{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    font:inherit;font-size:13.5px;padding:9px 34px 9px 34px;border-radius:10px;outline:none;
    transition:border-color .16s,box-shadow .16s;
  }
  .search input::placeholder{color:#5e677d}
  .search input:focus{border-color:#33507f;box-shadow:0 0 0 3px var(--accent-soft)}
  .search kbd{
    position:absolute;right:9px;font:600 10.5px/1 var(--mono);color:var(--muted);
    border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:3px 5px;background:var(--panel-2);
  }
  .side-count{
    margin-top:10px;font-size:11.5px;color:var(--muted);font-family:var(--mono);
    display:flex;justify-content:space-between;gap:8px;align-items:center;
  }
  .side-count .live-wrap{display:inline-flex;align-items:center;gap:6px}

  .list{flex:1 1 auto;overflow-y:auto;padding:6px 0 20px}
  .row{
    display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--border-soft);
    color:inherit;font:inherit;cursor:pointer;position:relative;
    padding:11px 14px 11px 15px;transition:background .14s;
  }
  .row:hover{background:rgba(255,255,255,.028)}
  .row[aria-current="true"]{background:linear-gradient(90deg,var(--accent-soft),rgba(43,96,255,.04))}
  .row[aria-current="true"]::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);
  }
  .row-title{
    font-size:13.8px;font-weight:540;line-height:1.4;color:#dfe3ec;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-word;
  }
  .row[aria-current="true"] .row-title{color:#fff}
  .row-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .row-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
  .row-meta .dot{width:3px;height:3px;border-radius:50%;background:#3a445c;flex:0 0 auto}
  .row-meta .ep{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .row-meta .age{flex:0 0 auto}

  .badge{
    display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;
    font:600 10px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;
    padding:3px 7px;border-radius:999px;border:1px solid transparent;
  }
  .badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .badge.approved{color:var(--ok);background:var(--ok-soft);border-color:rgba(62,207,142,.28)}
  .badge.denied{color:var(--bad);background:var(--bad-soft);border-color:rgba(255,107,107,.28)}
  .badge.mode{color:#8fb0ff;background:var(--accent-soft);border-color:rgba(43,96,255,.34)}
  .badge.host{color:#a9b2c6;background:rgba(139,147,167,.10);border-color:rgba(139,147,167,.24)}
  .badge.project{color:var(--purple);background:rgba(169,139,255,.10);border-color:rgba(169,139,255,.26)}
  .badge.muted{color:var(--muted);background:rgba(139,147,167,.08);border-color:rgba(139,147,167,.2)}

  .live{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:#4a5468}
  .live.fresh{background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.15);animation:pulse 2.2s ease-in-out infinite}
  .live.recent{background:var(--warn)}
  .live.stale{background:#4a5468}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  .skeleton{padding:12px 14px;border-bottom:1px solid var(--border-soft)}
  .skeleton i{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,#1a2130,#242d40,#1a2130);background-size:200% 100%;animation:shimmer 1.3s infinite}
  .skeleton i:nth-child(1){width:74%}
  .skeleton i:nth-child(2){width:52%;margin-top:9px;height:7px}
  .skeleton i:nth-child(3){width:34%;margin-top:7px;height:7px}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .empty{padding:38px 22px;text-align:center;color:var(--muted)}
  .empty .big{font-size:14px;color:#aab2c4;font-weight:560;margin-bottom:6px}
  .empty .small{font-size:12.5px;line-height:1.6}
  .empty .mark{
    width:40px;height:40px;margin:0 auto 12px;border-radius:50%;
    border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:#3a4560;
    animation:none;
  }

  /* ---------- viewer ---------- */
  .viewer{min-height:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
  .viewer::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(680px 320px at 80% -10%,rgba(43,96,255,.10),transparent 70%);
  }
  .viewer-head{
    flex:0 0 auto;position:relative;z-index:5;
    padding:16px 32px 14px;border-bottom:1px solid var(--border);
    background:rgba(11,14,20,.86);backdrop-filter:blur(10px);
  }
  .viewer-head-top{display:flex;align-items:flex-start;gap:14px}
  .viewer-title{
    font-size:19px;font-weight:640;line-height:1.32;letter-spacing:-.008em;margin:0;
    flex:1 1 auto;min-width:0;word-break:break-word;
  }
  .viewer-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--muted);font-family:var(--mono)}
  .viewer-meta .dot{width:3px;height:3px;border-radius:50%;background:#3a445c}
  .viewer-meta .fp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px}
  .viewer-actions{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
  .btn{
    display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);
    color:var(--muted);font:inherit;font-size:12.5px;font-weight:540;padding:7px 11px;border-radius:9px;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;text-decoration:none;
  }
  .btn:hover{color:var(--text);border-color:#2c374d;background:#161d2b}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:rgba(43,96,255,.5);color:#cbd8ff}
  .btn[hidden]{display:none}
  .btn .ico{opacity:.85}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.primary{border-color:rgba(43,96,255,.45);background:var(--accent-soft);color:#c2d2ff}
  .btn.primary:hover{background:rgba(43,96,255,.22);color:#fff}
  .btn.approve{border-color:rgba(62,207,142,.42);background:var(--ok-soft);color:#8fe6bd}
  .btn.approve:hover{background:rgba(62,207,142,.2);color:#c6f4de;border-color:rgba(62,207,142,.6)}
  .btn.deny{border-color:rgba(255,107,107,.42);background:var(--bad-soft);color:#ffa8a8}
  .btn.deny:hover{background:rgba(255,107,107,.2);color:#ffcaca;border-color:rgba(255,107,107,.6)}
  .btn.spin .ico{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- decide bar ---------- */
  .decide{margin-top:13px}
  .decide-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .decide-hint{font-size:12px;color:var(--muted)}
  .decide-confirm{
    display:flex;flex-direction:column;gap:9px;
    background:var(--panel-2);border:1px solid var(--border);border-radius:11px;padding:12px 13px;
    animation:fadeUp .2s ease both;
  }
  .decide-q{font-size:13px;color:#d6dbe6;line-height:1.5}
  .decide-q strong{color:#fff}
  .decide-confirm textarea{
    width:100%;min-height:64px;resize:vertical;background:var(--bg);border:1px solid var(--border);
    color:var(--text);font:inherit;font-size:13px;line-height:1.5;border-radius:9px;padding:9px 10px;outline:none;
    transition:border-color .16s,box-shadow .16s;
  }
  .decide-confirm textarea::placeholder{color:#5e677d}
  .decide-confirm textarea:focus{border-color:#33507f;box-shadow:0 0 0 3px var(--accent-soft)}
  .decide-label{font-size:11.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.02em}
  .decide-buttons{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .decide-result{
    display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.55;
    border-radius:11px;padding:11px 13px;border:1px solid var(--border);animation:fadeUp .2s ease both;
  }
  .decide-result .rk{flex:0 0 auto;font-size:13px;line-height:1.4}
  .decide-result.ok{color:#b6f0d6;background:var(--ok-soft);border-color:rgba(62,207,142,.32)}
  .decide-result.warn{color:#ffd9a0;background:var(--warn-soft);border-color:rgba(245,181,68,.32)}
  .decide-result.err{color:#ffb0b0;background:var(--bad-soft);border-color:rgba(255,107,107,.32)}
  .decide-result code{font-family:var(--mono);font-size:11.5px;word-break:break-all}

  .doc-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;position:relative;z-index:1}

  /* document body */
  .doc{max-width:820px;margin:0 auto;padding:38px 32px 120px}
  .md{line-height:1.75;font-size:15.2px;color:#dfe3ec;animation:fadeUp .28s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .md>*:first-child{margin-top:0}
  .md h1{font-size:25px;line-height:1.28;font-weight:650;letter-spacing:-.014em;margin:0 0 .5em;color:#fff}
  .md h2{font-size:19px;font-weight:620;letter-spacing:-.008em;margin:1.9em 0 .7em;padding-bottom:.34em;border-bottom:1px solid var(--border);color:#f0f2f7}
  .md h3{font-size:16.2px;font-weight:600;margin:1.5em 0 .45em;color:#eef0f6}
  .md h4{font-size:14.4px;font-weight:620;margin:1.25em 0 .35em;color:#e3e7ef}
  .md h5,.md h6{font-size:13.4px;font-weight:620;margin:1.1em 0 .3em;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .md p{margin:.85em 0}
  .md strong{color:#fff;font-weight:640}
  .md em{color:#e9ecf3}
  .md a{color:var(--link);text-decoration:none;border-bottom:1px solid rgba(111,155,255,.34);transition:border-color .15s,color .15s}
  .md a:hover{color:#9fbcff;border-bottom-color:currentColor}
  .md ul,.md ol{padding-left:1.5em;margin:.75em 0}
  .md li{margin:.32em 0}
  .md li::marker{color:#5f6a82}
  .md li>ul,.md li>ol{margin:.3em 0}
  .md hr{border:none;border-top:1px solid var(--border);margin:1.9em 0}
  .md img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--border)}

  .md code{font-family:var(--mono);font-size:.855em;background:var(--code-inline);border:1px solid #263048;border-radius:5px;padding:.13em .4em;color:#cfd9f0;word-break:break-word}
  .md pre{
    position:relative;background:var(--code-bg);border:1px solid var(--border);border-radius:12px;
    padding:15px 17px;margin:1.05em 0;overflow:auto;
  }
  .md pre code{display:block;background:none;border:0;padding:0;color:#c9d3e6;font-size:12.7px;line-height:1.68;white-space:pre}
  .md pre[data-lang]::before{
    content:attr(data-lang);position:absolute;top:9px;right:13px;
    font:600 9.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:#5f6a82;
  }
  .md pre[data-lang] code{padding-top:2px}

  .md blockquote{
    margin:1.05em 0;padding:.7em 1.15em;border-left:3px solid var(--accent);
    background:rgba(43,96,255,.055);border-radius:0 10px 10px 0;color:#c7cfdd;
  }
  .md blockquote p{margin:.35em 0}
  .md blockquote>*:first-child{margin-top:0}
  .md blockquote>*:last-child{margin-bottom:0}

  .md .callout{border-left-width:3px;padding-top:.85em}
  .md .callout .callout-label{
    display:flex;align-items:center;gap:6px;font:640 11px/1 var(--sans);letter-spacing:.06em;
    text-transform:uppercase;margin-bottom:.5em;
  }
  .md .callout .callout-label .mark{font-size:12px}
  .md .callout-note{border-left-color:var(--link);background:rgba(111,155,255,.07)}
  .md .callout-note .callout-label{color:var(--link)}
  .md .callout-tip{border-left-color:var(--ok);background:var(--ok-soft)}
  .md .callout-tip .callout-label{color:var(--ok)}
  .md .callout-important{border-left-color:var(--purple);background:rgba(169,139,255,.09)}
  .md .callout-important .callout-label{color:var(--purple)}
  .md .callout-warning{border-left-color:var(--warn);background:var(--warn-soft)}
  .md .callout-warning .callout-label{color:var(--warn)}
  .md .callout-caution{border-left-color:var(--bad);background:var(--bad-soft)}
  .md .callout-caution .callout-label{color:var(--bad)}

  .md .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:11px;margin:1.1em 0;background:var(--panel-2)}
  .md table{width:100%;border-collapse:collapse;font-size:13.3px;line-height:1.5}
  .md th{text-align:left;font-weight:620;color:#eaeef6;background:#151b28;padding:10px 13px;border-bottom:1px solid var(--border);white-space:nowrap}
  .md td{padding:9px 13px;border-bottom:1px solid var(--border-soft);vertical-align:top;color:#d3d9e5}
  .md tr:last-child td{border-bottom:none}
  .md tbody tr:hover{background:rgba(255,255,255,.02)}

  .md .task-list-item{list-style:none;margin-left:-1.3em}
  .md .task-list-item input{margin-right:.5em;accent-color:var(--accent)}

  .md .mermaid{
    background:#0e1420;border:1px solid var(--border);border-radius:12px;
    padding:20px 18px;margin:1.2em 0;display:flex;justify-content:center;overflow-x:auto;
  }
  .md .mermaid svg{max-width:100%;height:auto}
  .md .mermaid-failed{background:#150f16;border:1px solid #3a2430;border-radius:12px;padding:0;margin:1.2em 0;overflow:hidden}
  .md .mermaid-failed .mermaid-src{margin:0;border:0;border-bottom:1px solid #3a2430;border-radius:0;background:#0d0a12}
  .md .mermaid-error{padding:11px 15px;font-size:12.5px;color:#ffb0b0;display:flex;gap:8px;align-items:flex-start;line-height:1.5}

  .raw-wrap{max-width:900px;margin:0 auto;padding:30px 32px 120px}
  .raw-bar{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .raw-pre{
    background:var(--code-bg);border:1px solid var(--border);border-radius:12px;padding:18px;
    overflow:auto;margin:0;font-family:var(--mono);font-size:12.7px;line-height:1.7;color:#c9d3e6;white-space:pre;
  }

  .state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 30px;color:var(--muted);min-height:60vh;gap:14px}
  .state .big{font-size:15px;color:#c3cad9;font-weight:580}
  .state .small{font-size:13px;line-height:1.65;max-width:460px}
  .state .small code{font-family:var(--mono);background:var(--code-inline);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:12px;word-break:break-all}
  .spinner{width:26px;height:26px;border-radius:50%;border:2.5px solid #232c3e;border-top-color:var(--accent);animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .state .icon{width:40px;height:40px;color:#3a4560}

  .mobile-back{display:none}

  @media (max-width:900px){
    :root{--side-w:300px}
  }
  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .viewer{display:none}
    body.showing-detail .sidebar{display:none}
    body.showing-detail .viewer{display:flex}
    .doc{padding:22px 18px 100px}
    .raw-wrap{padding:20px 16px 100px}
    .viewer-head{padding:12px 16px}
    .viewer-title{font-size:16.5px}
    .mobile-back{display:inline-flex}
    .brand .sub{display:none}
    .topbar{padding:0 14px}
    .viewer-meta .fp{max-width:150px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#121722" stroke="#1e2636"/>
        <circle cx="16" cy="16" r="8" fill="none" stroke="#2b60ff" stroke-width="2.4"/>
        <circle cx="16" cy="16" r="3" fill="#3ecf8e"/>
      </svg>
      <h1>Plannotator sessions</h1>
      <span class="sub" id="brandCount"></span>
    </div>
    <div class="spacer"></div>
    <a class="back-link" href="/plans">
      Plan archive
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </header>

  <div class="app" id="app">
    <aside class="sidebar">
      <div class="side-head">
        <div class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
          <input id="search" type="search" placeholder="Search sessions…" autocomplete="off" spellcheck="false" aria-label="Search sessions">
          <kbd>/</kbd>
        </div>
        <div class="side-count">
          <span class="live-wrap"><span class="live" id="pollDot"></span><span id="listCount">Loading…</span></span>
          <span id="updatedAt"></span>
        </div>

      <div class="list scroll" id="list" role="listbox" aria-label="Active sessions"></div>
    </aside>

    <main class="viewer" id="viewer">
      <div class="viewer-head" id="viewerHead" hidden>
        <div class="viewer-head-top">
          <button class="btn mobile-back" id="mobileBack" aria-label="Back to list">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
            List
          </button>
          <h2 class="viewer-title" id="viewerTitle">—</h2>
          <div class="viewer-actions">
            <a class="btn" id="openLink" hidden target="_blank" rel="noopener noreferrer" title="Open this session in Plannotator">
              <svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
              Open
            </a>
            <button class="btn" id="rawToggle" aria-pressed="false" title="Show untouched markdown">
              <svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>
              Raw
            </button>
            <button class="btn" id="refreshPlan" title="Re-fetch the live plan">
              <svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
              Refresh
            </button>
          </div>
        </div>
        <div class="viewer-meta" id="viewerMeta"></div>
        <div class="decide" id="decide" aria-live="polite"></div>
      </div>
      <div class="doc-scroll scroll" id="docScroll">
        <div class="state" id="statePanel">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg>
          <div class="big">Select a session</div>
          <div class="small">Pick a live session to read the plan under review, then approve or deny it from here.</div>
        </div>
        <div class="doc" id="doc" hidden></div>
        <div class="raw-wrap" id="rawWrap" hidden>
          <div class="raw-bar">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>
            Raw markdown
          </div>
          <pre class="raw-pre scroll" id="rawPre"></pre>
        </div>
      </div>
    </main>
  </div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
(function(){
  "use strict";

  /* ===================================================================
     Constants / helpers
  =================================================================== */
  var API_SESSIONS = "api/sessions";
  var API_PLAN     = "api/live/plan";
  var API_DECIDE   = "api/sessions/decide";
  var POLL_MS      = 5000;

  var els = {
    list:        document.getElementById("list"),
    search:      document.getElementById("search"),
    listCount:   document.getElementById("listCount"),
    updatedAt:   document.getElementById("updatedAt"),
    pollDot:     document.getElementById("pollDot"),
    brandCount:  document.getElementById("brandCount"),
    viewerHead:  document.getElementById("viewerHead"),
    viewerTitle: document.getElementById("viewerTitle"),
    viewerMeta:  document.getElementById("viewerMeta"),
    decide:      document.getElementById("decide"),
    openLink:    document.getElementById("openLink"),
    rawToggle:   document.getElementById("rawToggle"),
    refreshPlan: document.getElementById("refreshPlan"),
    docScroll:   document.getElementById("docScroll"),
    doc:         document.getElementById("doc"),
    rawWrap:     document.getElementById("rawWrap"),
    rawPre:      document.getElementById("rawPre"),
    statePanel:  document.getElementById("statePanel"),
    mobileBack:  document.getElementById("mobileBack")
  };

  var state = {
    sessions: [],        // latest from server
    filtered: [],
    selected: null,      // session object currently shown
    selectedKey: null,
    selectedGone: false,
    query: "",
    plan: null,          // raw markdown
    meta: null,          // {mode, project, filePath}
    showRaw: false,
    planSeq: 0,
    clockSkew: 0,        // serverNow - clientNow (seconds)
    decide: { mode: null, busy: false, result: null },
    lastFetchOk: false,
    mounted: false
  };

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function el(tag, cls, txt){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(txt != null) n.textContent = txt;
    return n;
  }
  function keyOf(s){ return s.host + ":" + s.port; }
  function nowSec(){ return Date.now()/1000 + state.clockSkew; }

  function agoText(sec){
    var s = Math.max(0, Math.floor(sec));
    if(s < 60) return s + "s";
    if(s < 3600) return Math.floor(s/60) + "m";
    if(s < 86400) return Math.floor(s/3600) + "h";
    return Math.floor(s/86400) + "d";
  }
  function ageOf(s){ return nowSec() - (s.lastSeen || 0); }
  function freshness(age){
    if(age < 30) return "fresh";
    if(age < 180) return "recent";
    return "stale";
  }

  /* endpoint: p<port>.<suffix> when we can form it, else just the port */
  function endpointOf(s){
    var raw = s.url || s.hostname || s.portUrl || null;
    if(raw){
      var host = String(raw).replace(/^https?:\/\//i, "").replace(/\/+$/, "");
      return { text: host, href: /^https?:\/\//i.test(raw) ? String(raw) : "https://" + host };
    }
    var suffix = (typeof window.__SUFFIX__ === "string" && window.__SUFFIX__) ? window.__SUFFIX__
               : (s.suffix || s.hostSuffix || null);
    if(suffix){
      var h = "p" + s.port + "." + String(suffix).replace(/^\./, "");
      return { text: h, href: "https://" + h };
    }
    return { text: "p" + s.port, href: null };
  }

  function matches(s, q){
    if(!q) return true;
    var hay = [s.title, s.project, s.host, s.hostLabel, s.mode, s.port].join(" ").toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  /* ===================================================================
     Markdown / mermaid setup (same pipeline as the archive page)
  =================================================================== */
  var markedReady = false;
  if(window.marked){
    try{
      window.marked.setOptions({ gfm:true, breaks:false, pedantic:false });
      markedReady = true;
    }catch(e){ markedReady = !!window.marked.parse; }
  }

  var mermaidReady = false;
  if(window.mermaid){
    try{
      window.mermaid.initialize({
        startOnLoad:false,
        theme:"dark",
        darkMode:true,
        securityLevel:"strict",
        fontFamily:"ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif",
        themeVariables:{
          background:"#0e1420",
          primaryColor:"#1b2440",
          primaryBorderColor:"#33507f",
          primaryTextColor:"#e6e9ef",
          lineColor:"#5a6a8c",
          tertiaryColor:"#151b28",
          fontSize:"14px"
        },
        flowchart:{ useMaxWidth:true, htmlLabels:false },
        sequence:{ useMaxWidth:true }
      });
      mermaidReady = true;
    }catch(e){ mermaidReady = false; }
  }

  var BLOCKED = {script:1,style:1,iframe:1,object:1,embed:1,link:1,meta:1,base:1,
                 form:1,input:1,button:1,textarea:1,select:1,option:1,noscript:1,template:1};

  function sanitize(html){
    var tpl = document.createElement("template");
    tpl.innerHTML = html;
    walk(tpl.content);
    return tpl.innerHTML;

    function walk(root){
      var nodes = Array.prototype.slice.call(root.children);
      for(var i=0;i<nodes.length;i++){
        var el = nodes[i];
        var tag = el.tagName.toLowerCase();
        if(BLOCKED[tag]){ el.remove(); continue; }
        var attrs = Array.prototype.slice.call(el.attributes);
        for(var j=0;j<attrs.length;j++){
          var name = attrs[j].name, val = attrs[j].value, ln = name.toLowerCase();
          if(ln.indexOf("on") === 0){ el.removeAttribute(name); continue; }
          if(ln === "srcdoc"){ el.removeAttribute(name); continue; }
          if(ln === "href" || ln === "src" || ln === "xlink:href"){
            var v = String(val).replace(/[\u0000-\u0020]/g, "");
            var bad = /^(javascript|vbscript|file):/i.test(v) ||
                      (/^data:/i.test(v) && !(ln === "src" && /^data:image\//i.test(v)));
            if(bad) el.removeAttribute(name);
          }
        }
        if(tag === "a"){
          el.setAttribute("rel","noopener noreferrer");
          el.setAttribute("target","_blank");
        }
        walk(el);
      }
    }
  }

  function buildMarkdownDom(md){
    if(!markedReady || !window.marked || typeof window.marked.parse !== "function"){
      var fallback = el("pre","raw-pre");
      fallback.textContent = md;
      return fallback;
    }
    var root = el("div","md");
    root.innerHTML = sanitize(window.marked.parse(md));

    Array.prototype.slice.call(root.querySelectorAll("pre > code.language-mermaid")).forEach(function(code){
      var pre = code.parentElement;
      var d = el("div","mermaid");
      d.dataset.source = code.textContent;
      d.textContent = code.textContent;
      pre.replaceWith(d);
    });
    Array.prototype.slice.call(root.querySelectorAll("pre > code")).forEach(function(code){
      var pre = code.parentElement;
      var m = /language-([\w+#-]+)/i.exec(code.className || "");
      if(m) pre.dataset.lang = m[1].toLowerCase();
    });
    Array.prototype.slice.call(root.querySelectorAll("table")).forEach(function(t){
      var wrap = el("div","table-wrap");
      t.replaceWith(wrap);
      wrap.appendChild(t);
    });
    var MARK = {note:"ℹ",tip:"✦",important:"❗",warning:"⚠",caution:"⚠"};
    Array.prototype.slice.call(root.querySelectorAll("blockquote")).forEach(function(bq){
      var p = bq.querySelector("p");
      if(!p) return;
      var m = /^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i.exec(p.textContent || "");
      if(!m) return;
      var kind = m[1].toLowerCase();
      p.textContent = p.textContent.replace(m[0], "");
      bq.classList.add("callout","callout-"+kind);
      var label = el("div","callout-label");
      label.appendChild(el("span","mark",MARK[kind] || "•"));
      label.appendChild(document.createTextNode(kind));
      bq.insertBefore(label, bq.firstChild);
    });
    return root;
  }

  function failMermaid(node, msg){
    var src = node.dataset.source || "";
    node.classList.remove("mermaid");
    node.classList.add("mermaid-failed");
    node.textContent = "";
    var pre = el("pre","mermaid-src"), code = el("code", null, src);
    pre.appendChild(code);
    var note = el("div","mermaid-error");
    note.appendChild(document.createTextNode("⚠"));
    note.appendChild(el("span", null, "Couldn't render this diagram — " + (msg || "unknown error") + "."));
    node.appendChild(pre);
    node.appendChild(note);
  }

  function runMermaid(root){
    var nodes = Array.prototype.slice.call(root.querySelectorAll(".mermaid"));
    if(!nodes.length) return;
    if(!mermaidReady || !window.mermaid){
      nodes.forEach(function(n){ failMermaid(n, "Mermaid library unavailable"); });
      return;
    }
    var good = [];
    Promise.all(nodes.map(function(n){
      var src = n.dataset.source || n.textContent || "";
      return Promise.resolve()
        .then(function(){ return window.mermaid.parse(src); })
        .then(function(){ good.push(n); })
        .catch(function(err){ failMermaid(n, (err && err.message) ? err.message : "invalid diagram syntax"); });
    })).then(function(){
      if(!good.length) return null;
      return window.mermaid.run({ nodes: good, suppressErrors: true });
    }).catch(function(){}).then(function(){
      good.forEach(function(n){
        if(!n.querySelector("svg")) failMermaid(n, "render failed");
        else n.classList.add("mermaid-ok");
      });
    });
  }

  /* ===================================================================
     Session list
  =================================================================== */
  function renderList(preserveScroll){
    var top = preserveScroll ? els.list.scrollTop : 0;
    els.list.textContent = "";

    if(!state.filtered.length){
      var em = el("div","empty");
      var mark = el("div","mark");
      mark.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>';
      em.appendChild(mark);
      if(state.query){
        em.appendChild(el("div","big","No sessions match"));
        em.appendChild(el("div","small","Try a different search term."));
      } else {
        em.appendChild(el("div","big","No active sessions"));
        em.appendChild(el("div","small","Nothing is waiting for review right now. This list refreshes itself every few seconds."));
      }
      els.list.appendChild(em);
      els.list.scrollTop = top;
      return;
    }

    var frag = document.createDocumentFragment();
    state.filtered.forEach(function(s){
      var row = el("button","row");
      row.type = "button";
      row.setAttribute("role","option");
      row.dataset.key = keyOf(s);
      row.setAttribute("aria-current", (state.selectedKey === keyOf(s)) ? "true" : "false");

      row.appendChild(el("div","row-title", s.title || s.project || ("session on port " + s.port)));

      var tags = el("div","row-tags");
      if(s.mode) tags.appendChild(el("span","badge mode", s.mode));
      tags.appendChild(el("span","badge host", s.hostLabel || s.host));
      if(s.project) tags.appendChild(el("span","badge project", s.project));
      row.appendChild(tags);

      var meta = el("div","row-meta");
      var age = ageOf(s);
      meta.appendChild(el("span","live "+freshness(age)));
      meta.appendChild(el("span","ep", endpointOf(s).text));
      meta.appendChild(el("span","dot"));
      var ageEl = el("span","age","seen " + agoText(age) + " ago");
      ageEl.dataset.ageFor = keyOf(s);
      meta.appendChild(ageEl);
      row.appendChild(meta);

      row.addEventListener("click", function(){ selectSession(s); });
      frag.appendChild(row);
    });
    els.list.appendChild(frag);
    els.list.scrollTop = top;
  }

  /* update just the age text + freshness dots, every second */
  function tickAges(){
    var dots = els.list.querySelectorAll(".row");
    Array.prototype.slice.call(dots).forEach(function(row){
      var s = state.sessions.find(function(x){ return keyOf(x) === row.dataset.key; });
      if(!s) return;
      var age = ageOf(s);
      var ageEl = row.querySelector(".age");
      if(ageEl) ageEl.textContent = "seen " + agoText(age) + " ago";
      var live = row.querySelector(".live");
      if(live) live.className = "live " + freshness(age);
    });
    if(state.selected){
      var v = document.getElementById("viewerSeen");
      if(v){
        var a = ageOf(state.selected);
        v.textContent = "seen " + agoText(a) + " ago";
      }
    }
  }

  function countLine(){
    if(!state.lastFetchOk){ els.listCount.textContent = ""; els.brandCount.textContent = ""; return; }
    var n = state.filtered.length, total = state.sessions.length;
    els.brandCount.textContent = total + (total === 1 ? " session" : " sessions");
    els.listCount.textContent = (n === total)
      ? total + (total === 1 ? " active session" : " active sessions")
      : n + " of " + total + " sessions";
  }

  function loadSessions(opts){
    opts = opts || {};
    var first = !state.mounted;
    if(first){
      els.list.textContent = "";
      for(var i=0;i<4;i++){
        var sk = el("div","skeleton");
        sk.appendChild(el("i")); sk.appendChild(el("i")); sk.appendChild(el("i"));
        els.list.appendChild(sk);
      }
      els.listCount.textContent = "Loading…";
    }

    fetch(API_SESSIONS, { headers: { "Accept": "application/json" } })
      .then(function(res){
        if(!res.ok) throw new Error("HTTP " + res.status + " " + (res.statusText || ""));
        return res.json();
      })
      .then(function(data){
        var list = (data && Array.isArray(data.sessions)) ? data.sessions.slice() : [];
        if(data && typeof data.now === "number"){
          state.clockSkew = data.now - (Date.now()/1000);
        }
        state.sessions = list;
        state.lastFetchOk = true;
        state.mounted = true;

        var q = state.query.trim().toLowerCase();
        state.filtered = state.sessions.filter(function(s){ return matches(s, q); });

        /* keep the selection alive across refreshes */
        if(state.selectedKey){
          var still = state.sessions.find(function(x){ return keyOf(x) === state.selectedKey; });
          if(still){
            state.selected = still;
            state.selectedGone = false;
          } else {
            state.selectedGone = true;
          }
        }

        renderList(true);
        countLine();
        els.updatedAt.textContent = "updated " + new Date().toLocaleTimeString();
        if(!state.sessions.length && state.selectedKey){
          /* nothing left; keep the plan but flag it */
        }
        renderDecide();
        updateOpenLink();
        if(first && !state.selectedKey) restoreFromHash();
      })
      .catch(function(err){
        state.lastFetchOk = false;
        state.mounted = true;
        els.list.textContent = "";
        var em = el("div","empty");
        var mark = el("div","mark");
        mark.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
        em.appendChild(mark);
        em.appendChild(el("div","big","Couldn't load sessions"));
        em.appendChild(el("div","small","Request to " + API_SESSIONS + " failed (" + esc(err && err.message ? err.message : "unknown error") + "). Retrying automatically."));
        els.list.appendChild(em);
        countLine();
        els.updatedAt.textContent = "";
        els.pollDot.className = "live stale";
      });
  }

  /* ===================================================================
     Viewer
  =================================================================== */
  function showState(kind, title, detail){
    els.doc.hidden = true;
    els.rawWrap.hidden = true;
    els.statePanel.hidden = false;
    els.statePanel.textContent = "";
    if(kind === "loading"){
      els.statePanel.appendChild(el("div","spinner"));
      els.statePanel.appendChild(el("div","big", title || "Loading plan…"));
    } else {
      var ico = document.createElementNS("http://www.w3.org/2000/svg","svg");
      ico.setAttribute("class","icon"); ico.setAttribute("viewBox","0 0 24 24");
      ico.setAttribute("fill","none"); ico.setAttribute("stroke","currentColor");
      ico.setAttribute("stroke-width","1.6");
      ico.innerHTML = (kind === "error")
        ? '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>'
        : '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>';
      els.statePanel.appendChild(ico);
      els.statePanel.appendChild(el("div","big", title || ""));
      if(detail) els.statePanel.appendChild(el("div","small", detail));
    }
    els.docScroll.scrollTop = 0;
  }

  function updateOpenLink(){
    var s = state.selected;
    if(!s){ els.openLink.hidden = true; return; }
    var ep = endpointOf(s);
    if(ep.href){
      els.openLink.href = ep.href;
      els.openLink.hidden = false;
    } else {
      els.openLink.hidden = true;
    }
  }

  function renderViewerHead(s, heading){
    els.viewerHead.hidden = false;
    els.viewerTitle.textContent = heading || s.title || s.project || ("port " + s.port);

    var meta = els.viewerMeta;
    meta.textContent = "";
    if(s.mode) meta.appendChild(el("span","badge mode", s.mode));
    meta.appendChild(el("span","badge host", s.hostLabel || s.host));
    if(s.project) meta.appendChild(el("span","badge project", s.project));
    meta.appendChild(el("span","dot"));
    var ep = endpointOf(s);
    var epEl = el("span", null, ep.text);
    if(ep.href) epEl.title = ep.href;
    meta.appendChild(epEl);
    meta.appendChild(el("span","dot"));
    var seen = el("span", null, "seen " + agoText(ageOf(s)) + " ago");
    seen.id = "viewerSeen";
    meta.appendChild(seen);
    if(state.meta && state.meta.filePath){
      meta.appendChild(el("span","dot"));
      var fp = el("span","fp", state.meta.filePath);
      fp.title = state.meta.filePath;
      meta.appendChild(fp);
    }
    updateOpenLink();
  }

  function firstHeading(md){
    var lines = String(md).split(/\r?\n/);
    for(var i=0;i<lines.length && i<60;i++){
      var m = /^#\s+(.+?)\s*$/.exec(lines[i]);
      if(m) return m[1].replace(/[*_`]/g,"").trim();
    }
    return null;
  }

  function renderDoc(){
    if(state.plan == null) return;
    if(state.showRaw){
      els.doc.hidden = true;
      els.statePanel.hidden = true;
      els.rawWrap.hidden = false;
      els.rawPre.textContent = state.plan;
      els.docScroll.scrollTop = 0;
      return;
    }
    els.rawWrap.hidden = true;
    els.statePanel.hidden = true;
    els.doc.hidden = false;
    els.doc.textContent = "";
    var built = buildMarkdownDom(state.plan);
    built.style.animation = "none";
    els.doc.appendChild(built);
    void built.offsetWidth;
    built.style.animation = "";
    els.docScroll.scrollTop = 0;
    runMermaid(els.doc);
  }

  function fetchPlan(s, opts){
    opts = opts || {};
    state.planSeq++;
    var seq = state.planSeq;
    if(!opts.keepScroll){
      state.plan = null;
      state.meta = null;
      state.showRaw = false;
      els.rawToggle.setAttribute("aria-pressed","false");
      renderViewerHead(s, s.title || s.project || ("port " + s.port));
      showState("loading", "Loading live plan…");
    } else {
      els.refreshPlan.classList.add("spin");
      els.refreshPlan.disabled = true;
    }

    var url = API_PLAN + "?host=" + encodeURIComponent(s.host) + "&port=" + encodeURIComponent(s.port);
    fetch(url, { headers: { "Accept": "application/json" } })
      .then(function(res){
        return res.json().catch(function(){ return null; }).then(function(j){ return { status: res.status, ok: res.ok, body: j }; });
      })
      .then(function(r){
        if(seq !== state.planSeq) return;
        if(!r.ok || !r.body || typeof r.body.plan !== "string"){
          var msg = (r.body && r.body.error) ? r.body.error
                  : ("The hub returned HTTP " + r.status + " for this session.");
          showState("error", "Couldn't load the live plan", msg + " It may have been decided or closed already.");
          return;
        }
        state.plan = r.body.plan;
        state.meta = { mode: r.body.mode, project: r.body.project, filePath: r.body.filePath };
        if(state.selected) state.selected = Object.assign({}, state.selected, {
          mode: r.body.mode || state.selected.mode,
          project: r.body.project || state.selected.project
        });
        var h = firstHeading(state.plan);
        renderViewerHead(state.selected, h || state.selected.title);
        renderDoc();
      })
      .catch(function(err){
        if(seq !== state.planSeq) return;
        showState("error", "Couldn't load the live plan",
          "The request to <code>" + esc(url) + "</code> failed (" + esc(err && err.message ? err.message : "network error") + ").");
      })
      .then(function(){
        els.refreshPlan.classList.remove("spin");
        els.refreshPlan.disabled = false;
      });
  }

  function selectSession(s){
    state.selected = s;
    state.selectedKey = keyOf(s);
    state.selectedGone = false;
    state.decide = { mode: null, busy: false, result: null };

    document.body.classList.add("showing-detail");
    /* active row */
    Array.prototype.slice.call(els.list.querySelectorAll(".row")).forEach(function(r){
      r.setAttribute("aria-current", (r.dataset.key === state.selectedKey) ? "true" : "false");
    });
    renderDecide();
    updateOpenLink();
    try{ history.replaceState(null, "", "#" + encodeURIComponent(s.host) + "/" + encodeURIComponent(s.port)); }catch(e){}
    fetchPlan(s);
  }

  /* ===================================================================
     Decide bar
  =================================================================== */
  function renderDecide(){
    var d = els.decide;
    d.textContent = "";
    if(!state.selected) return;

    if(state.decide.result){
      var res = el("div","decide-result " + state.decide.result.kind);
      res.appendChild(el("span","rk", state.decide.result.kind === "ok" ? "✓" : (state.decide.result.kind === "warn" ? "ⓘ" : "⚠")));
      var body = el("div");
      body.innerHTML = state.decide.result.html;
      res.appendChild(body);
      d.appendChild(res);
      var again = el("div","decide-row");
      var againBtn = el("button","btn", "Done");
      againBtn.type = "button";
      againBtn.addEventListener("click", function(){
        state.decide = { mode:null, busy:false, result:null };
        renderDecide();
      });
      again.appendChild(againBtn);
      d.appendChild(again);
      return;
    }

    if(state.decide.mode){
      var kind = state.decide.mode; /* "approve" | "deny" */
      var box = el("div","decide-confirm");
      var q = el("div","decide-q");
      if(kind === "approve"){
        q.innerHTML = "Approve this plan? This accepts it and <strong>ends the review</strong> in the session.";
      } else {
        q.innerHTML = "Deny this plan? The session gets your feedback and <strong>ends the review</strong>.";
      }
      box.appendChild(q);

      var ta = null;
      if(kind === "deny"){
        box.appendChild(el("div","decide-label","Reason (optional)"));
        ta = document.createElement("textarea");
        ta.placeholder = "Why isn't this plan right? Anything useful for the next pass…";
        ta.value = (state.decide.feedback || "");
        ta.addEventListener("input", function(){ state.decide.feedback = ta.value; });
        box.appendChild(ta);
      }

      var buttons = el("div","decide-buttons");
      var confirmBtn = el("button","btn " + (kind === "approve" ? "approve" : "deny"));
      confirmBtn.type = "button";
      confirmBtn.textContent = state.decide.busy
        ? (kind === "approve" ? "Approving…" : "Denying…")
        : (kind === "approve" ? "Confirm approve" : "Confirm deny");
      if(state.decide.busy){
        confirmBtn.disabled = true;
        confirmBtn.classList.add("spin");
      }
      confirmBtn.addEventListener("click", function(){ submitDecision(kind); });

      var cancel = el("button","btn","Cancel");
      cancel.type = "button";
      cancel.disabled = state.decide.busy;
      cancel.addEventListener("click", function(){
        state.decide.mode = null;
        renderDecide();
      });

      buttons.appendChild(confirmBtn);
      buttons.appendChild(cancel);
      if(state.decide.busy) buttons.appendChild(el("span","decide-hint","Sending decision…"));
      box.appendChild(buttons);
      d.appendChild(box);
      return;
    }

    /* default: the two buttons */
    var row = el("div","decide-row");
    var approve = el("button","btn approve");
    approve.type = "button";
    approve.innerHTML = '<svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg> Approve';
    approve.addEventListener("click", function(){
      state.decide.mode = "approve"; state.decide.result = null; renderDecide();
    });

    var deny = el("button","btn deny");
    deny.type = "button";
    deny.innerHTML = '<svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg> Deny';
    deny.addEventListener("click", function(){
      state.decide.mode = "deny"; state.decide.feedback = ""; state.decide.result = null; renderDecide();
    });

    row.appendChild(approve);
    row.appendChild(deny);
    if(state.selectedGone){
      var gone = el("span","decide-hint","This session is no longer listed — it may have ended.");
      row.appendChild(gone);
    } else {
      row.appendChild(el("span","decide-hint","Deciding ends the review."));
    }
    d.appendChild(row);
  }

  function parseMaybeJson(str){
    if(typeof str !== "string") return str || null;
    var t = str.trim();
    if(!t) return null;
    try{ return JSON.parse(t); }catch(e){}
    var m = t.match(/\{[\s\S]*\}/);
    if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
    return null;
  }

  function findPathValue(obj){
    if(!obj || typeof obj !== "object") return null;
    var keys = ["savedTo","saved_to","filePath","file_path","path","filename","file","planPath","plan_path","output","name"];
    for(var i=0;i<keys.length;i++){
      var k = keys[i];
      if(typeof obj[k] === "string" && obj[k]) return obj[k];
      if(obj[k] && typeof obj[k] === "object"){
        var nested = findPathValue(obj[k]);
        if(nested) return nested;
      }
    }
    return null;
  }

  function successHtml(kind, body){
    var verb = kind === "approve" ? "Approved" : "Denied";
    var parsed = parseMaybeJson(body.upstream);
    var path = findPathValue(parsed);
    var msg = "<strong>" + verb + "</strong>";
    if(path) msg += " · saved to <code>" + esc(path) + "</code>";
    else if(typeof body.upstream === "string" && body.upstream.trim() && !parsed){
      msg += " · <code>" + esc(body.upstream.trim().slice(0,160)) + "</code>";
    }
    if(body.status) msg += " <span style='opacity:.7'>(upstream " + esc(body.status) + ")</span>";
    return msg + ".";
  }

  function denyUnsupportedHtml(errorText){
    return "<strong>This session can't be denied remotely.</strong> It was started from the plain CLI, which has no deny endpoint — open it in Plannotator and respond there instead." +
      (errorText ? " <span style='opacity:.7'>(" + esc(String(errorText).slice(0,160)) + ")</span>" : "");
  }

  function submitDecision(kind){
    if(!state.selected || state.decide.busy) return;
    var s = state.selected;
    var feedback = (kind === "deny") ? String(state.decide.feedback || "").trim() : "";

    state.decide.busy = true;
    renderDecide();

    fetch(API_DECIDE, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ host: s.host, port: s.port, decision: kind, feedback: feedback })
    })
      .then(function(res){
        return res.json().catch(function(){ return null; }).then(function(j){ return { status: res.status, body: j || {} }; });
      })
      .then(function(r){
        var b = r.body || {};
        if(b.ok){
          state.decide.result = { kind:"ok", html: successHtml(kind, b) };
        } else if(b.status === 404 || /(^|\D)404(\D|$)/.test(String(b.error || ""))){
          state.decide.result = { kind:"warn", html: denyUnsupportedHtml(b.error) };
        } else {
          var msg = b.error || ("The hub returned HTTP " + (b.status || r.status) + ".");
          state.decide.result = { kind:"err", html: "<strong>Couldn't " + esc(kind) + ".</strong> " + esc(String(msg)) };
        }
      })
      .catch(function(err){
        state.decide.result = { kind:"err", html: "<strong>Couldn't reach the hub.</strong> " + esc(err && err.message ? err.message : "network error") + ". Try again in a moment." };
      })
      .then(function(){
        state.decide.busy = false;
        state.decide.mode = null;
        renderDecide();
        loadSessions({ silent:true });
      });
  }

  /* ===================================================================
     Hash restore
  =================================================================== */
  function fromHash(){
    var h = location.hash.replace(/^#/, "");
    if(!h) return null;
    var parts = h.split("/");
    if(parts.length < 2) return null;
    var host = decodeURIComponent(parts[0]);
    var port = Number(decodeURIComponent(parts.slice(1).join("/")));
    if(!host || !port) return null;
    return state.sessions.find(function(s){ return s.host === host && Number(s.port) === port; }) || null;
  }
  function restoreFromHash(){
    var s = fromHash();
    if(s) selectSession(s);
  }

  /* ===================================================================
     Events
  =================================================================== */
  var searchTimer = null;
  els.search.addEventListener("input", function(){
    clearTimeout(searchTimer);
    var v = els.search.value;
    searchTimer = setTimeout(function(){
      state.query = v;
      var q = v.trim().toLowerCase();
      state.filtered = state.sessions.filter(function(s){ return matches(s, q); });
      renderList(false);
      countLine();
    }, 120);
  });

  els.rawToggle.addEventListener("click", function(){
    if(state.plan == null) return;
    state.showRaw = !state.showRaw;
    els.rawToggle.setAttribute("aria-pressed", String(state.showRaw));
    renderDoc();
  });

  els.refreshPlan.addEventListener("click", function(){
    if(state.selected) fetchPlan(state.selected, { keepScroll:true });
  });

  els.mobileBack.addEventListener("click", function(){
    document.body.classList.remove("showing-detail");
  });

  document.addEventListener("keydown", function(e){
    var tag = (e.target && e.target.tagName || "").toLowerCase();
    var typing = tag === "input" || tag === "textarea";
    if(e.key === "/" && !typing){
      e.preventDefault(); els.search.focus(); els.search.select();
    } else if(e.key === "Escape" && typing){
      els.search.value = ""; state.query = "";
      state.filtered = state.sessions.slice();
      renderList(false); countLine(); els.search.blur();
    } else if(!typing && (e.key === "ArrowDown" || e.key === "ArrowUp") && state.filtered.length){
      e.preventDefault();
      var idx = state.selectedKey ? state.filtered.findIndex(function(s){ return keyOf(s) === state.selectedKey; }) : -1;
      var next = e.key === "ArrowDown"
        ? Math.min(state.filtered.length - 1, idx + 1)
        : Math.max(0, (idx < 0 ? 0 : idx - 1));
      selectSession(state.filtered[next]);
      var active = els.list.querySelector('.row[aria-current="true"]');
      if(active) active.scrollIntoView({ block:"nearest" });
    }
  });

  window.addEventListener("hashchange", function(){
    if(!state.sessions.length) return;
    var s = fromHash();
    if(!s) return;
    if(state.selectedKey === keyOf(s)) return;
    selectSession(s);
  });

  /* ===================================================================
     Boot + polling
  =================================================================== */
  loadSessions();
  setInterval(loadSessions, POLL_MS);   /* refresh the list every ~5s */
  setInterval(tickAges, 1000);          /* smooth "seen Xs ago" between polls */
})();
</script>
</body>
</html>
